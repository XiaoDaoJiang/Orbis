name: Orbis Pages Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated artifact to GitHub Pages'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orbis-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and validate production artifact
        run: pnpm build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' && inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          routes=(
            '/'
            '/latest/'
            '/archive.json'
            '/2026/08/28/'
            '/2026/08/27/'
            '/2026/08/27/payload-1.txt'
            '/2026/08/27/payload-2a.txt'
            '/2026/08/27/payload-2b.txt'
            '/2026/08/27/payload-3.txt'
            '/2026/08/27/payload-4.txt'
            '/briefs/2026-08-28/'
            '/slides/2026-08-28/'
            '/rss.xml'
            '/favicon.svg'
          )
          fetch() {
            route="$1"
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 30 "${base}${route}" -o /tmp/orbis-smoke-body; then
                echo "PASS ${route}"
                return 0
              fi
              echo "Retry ${attempt}/12 ${route}"
              sleep 5
            done
            echo "FAIL ${route}"
            return 1
          }
          for route in "${routes[@]}"; do fetch "$route"; done
          curl --fail --silent --show-error --location "${base}/archive.json" | jq -e '.latest and (.issues | length > 0)' >/dev/null
          curl --fail --silent --show-error --location "${base}/rss.xml" | grep -q '<rss'
          echo 'Production Pages smoke checks passed.'
