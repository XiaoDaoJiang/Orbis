name: Orbis Site Build

on:
  push:
    branches:
      - main
      - planning/astro-slidev-monorepo
    paths:
      - 'apps/**'
      - 'content/**'
      - 'config/**'
      - 'docs/**'
      - 'packages/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbis-site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test site
        run: pnpm build
      - name: Upload assembled site
        uses: actions/upload-artifact@v7
        with:
          name: orbis-site
          path: dist/site
          if-no-files-found: error
          retention-days: 14
