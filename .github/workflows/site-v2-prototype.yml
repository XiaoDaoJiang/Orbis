name: Site V2 prototype

on:
  push:
    branches:
      - feat/site-v2-foundation
  pull_request:
    paths:
      - 'apps/**'
      - 'content/**'
      - 'packages/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site-v2-prototype.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build and test prototype
        run: pnpm build
      - name: Upload assembled prototype
        uses: actions/upload-artifact@v4
        with:
          name: orbis-site-v2-prototype
          path: dist/site
          if-no-files-found: error
