name: Orbis PR Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: orbis-pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ORIGIN: https://raw.githack.com
      SITE_BASE: /${{ github.repository }}/preview-pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve PR integration base
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          echo "ORBIS_PR_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "PR integration base: $base_sha"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Guard generated paths
        run: pnpm path:guard --mode pr --base "$ORBIS_PR_BASE_SHA"
      - name: Guard scheduled Daily
        if: ${{ startsWith(github.head_ref, 'automation/daily/') }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          target_date="${HEAD_REF#automation/daily/}"
          pnpm automation:daily:guard --base "$ORBIS_PR_BASE_SHA" --target-date "$target_date"
      - name: Build preview
        run: pnpm build
      - name: Upload public-preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: orbis-pr-preview
          path: dist/site
          if-no-files-found: error
          retention-days: 7
