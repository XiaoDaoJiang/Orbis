name: Orbis Build Portability

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: orbis-build-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.build-scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve portability base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="$(git rev-parse HEAD^1)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="0000000000000000000000000000000000000000"
          fi
          if [ -z "$base_sha" ]; then
            base_sha="0000000000000000000000000000000000000000"
          fi
          echo "ORBIS_PORTABILITY_BASE=$base_sha" >> "$GITHUB_ENV"
          echo "Portability base: $base_sha"
      - name: Resolve portability scope
        id: build-scope
        run: node tools/incremental-build/build-scope.mjs --base "$ORBIS_PORTABILITY_BASE"

  build:
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' }}
    name: Build (${{ matrix.os }}, Node ${{ matrix.node }}, standalone=${{ matrix.standalone }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.13.0'
            standalone: false
          - os: windows-latest
            node: '22'
            standalone: false
          - os: windows-latest
            node: '24.16.0'
            standalone: false
          - os: windows-latest
            node: '24'
            standalone: true
          - os: macos-latest
            node: '24'
            standalone: false
    defaults:
      run:
        working-directory: workspace/Orbis build 中文
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/Orbis build 中文
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: workspace/Orbis build 中文/package.json
          standalone: ${{ matrix.standalone }}
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce legacy CRLF Markdown worktree
        if: runner.os == 'Windows' && matrix.node == '24.16.0'
        run: node tools/build/prepare-crlf-worktree.mjs
      - name: Build and verify all contracts and artifacts
        run: pnpm build
      - name: Verify fixtures did not modify tracked sources
        run: git diff --exit-code
