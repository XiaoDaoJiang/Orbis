name: Orbis Feed Discovery Snapshot

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/feeds.yaml'
      - 'tools/feed-discovery/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/feed-discovery-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: orbis-feed-discovery-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'XiaoDaoJiang/Orbis'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Native Feed Discovery
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/orbis-feed-discovery-latest.json"
          pnpm exec tsx tools/feed-discovery/index.ts --pretty > "$snapshot"

          node - "$snapshot" <<'NODE'
          const fs = require('node:fs')
          const path = process.argv[2]
          const report = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (report.schemaVersion !== 1) throw new Error('Unexpected feed discovery schemaVersion')
          if (!report.generatedAt || Number.isNaN(Date.parse(report.generatedAt))) {
            throw new Error('Feed discovery snapshot is missing a valid generatedAt')
          }
          report.runtimeSnapshot = {
            version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            sourceRef: 'main',
            sourceCommit: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
          }
          fs.writeFileSync(path, `${JSON.stringify(report, null, 2)}\n`)
          NODE

      - name: Publish runtime snapshot branch
        shell: bash
        env:
          SNAPSHOT_BRANCH: runtime/feed-discovery
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/orbis-feed-discovery-latest.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          blob="$(git hash-object -w "$snapshot")"
          tree="$(printf '100644 blob %s\tlatest.json\n' "$blob" | git mktree)"
          commit="$(printf 'chore: refresh feed discovery snapshot\n' | git commit-tree "$tree")"

          git push --force origin "$commit:refs/heads/$SNAPSHOT_BRANCH"
