name: Orbis PR Preview Publish

on:
  workflow_run:
    workflows: ['Orbis PR Preview Build']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve preview metadata
        id: preview
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo 'No pull request is associated with this workflow run'
            exit 1
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=preview-pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githack.com/${GITHUB_REPOSITORY}/preview-pr-$PR_NUMBER/index.html" >> "$GITHUB_OUTPUT"
      - name: Download trusted build artifact
        uses: actions/download-artifact@v7
        with:
          name: orbis-pr-preview
          path: preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.preview.outputs.branch }}
          publish_dir: ./preview
          force_orphan: true
          enable_jekyll: false
      - name: Verify public preview availability
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          preview_root="${PREVIEW_URL%/index.html}"
          for attempt in $(seq 1 12); do
            if rss="$(curl --fail --silent --show-error --location --max-time 15 "$preview_root/rss.xml")" \
              && grep -q '<rss' <<< "$rss" \
              && curl --fail --silent --show-error --location --max-time 15 "$preview_root/favicon.svg" > /dev/null; then
              echo "Public preview assets are reachable: $PREVIEW_URL"
              exit 0
            fi
            echo "Preview not visible yet (attempt $attempt/12)"
            sleep 5
          done
          echo "Public preview did not become reachable: $PREVIEW_URL" >&2
          exit 1
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          body_file="$(mktemp)"
          printf '%s\n\n%s\n' \
            "Orbis public preview: $PREVIEW_URL" \
            'This preview was rebuilt from the read-only PR artifact and passed a public availability smoke check before this comment was posted.' \
            > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
