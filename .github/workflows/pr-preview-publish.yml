name: Orbis PR Preview Publish

on:
  workflow_run:
    workflows: ['Orbis PR Preview Build']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve preview metadata
        id: preview
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo 'No pull request is associated with this workflow run'
            exit 1
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=preview-pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githack.com/${GITHUB_REPOSITORY}/preview-pr-$PR_NUMBER/index.html" >> "$GITHUB_OUTPUT"
      - name: Download trusted build artifact
        uses: actions/download-artifact@v7
        with:
          name: orbis-pr-preview
          path: preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.preview.outputs.branch }}
          publish_dir: ./preview
          force_orphan: true
          enable_jekyll: false
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Orbis public preview: $PREVIEW_URL\n\nThis preview is rebuilt from the PR artifact and published without exposing a write token to PR code."
