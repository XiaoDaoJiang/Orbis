name: Orbis PR Preview Publish

on:
  push:
    branches:
      - planning/astro-slidev-monorepo
    paths:
      - '.github/workflows/pr-preview-publish.yml'
  workflow_run:
    workflows: ['Orbis PR Preview Build']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish-preview:
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve preview metadata
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = 'push' ]; then
            PR_NUMBER=2
            RUN_ID=33164584750
          else
            PR_NUMBER="$WORKFLOW_PR"
            RUN_ID="$WORKFLOW_RUN_ID"
          fi
          if [ -z "$PR_NUMBER" ] || [ -z "$RUN_ID" ]; then
            echo 'No pull request or source workflow run is available'
            exit 1
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "branch=preview-pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githack.com/${GITHUB_REPOSITORY}/preview-pr-$PR_NUMBER/index.html" >> "$GITHUB_OUTPUT"
      - name: Download trusted build artifact
        uses: actions/download-artifact@v7
        with:
          name: orbis-pr-preview
          path: preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.preview.outputs.run_id }}
      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.preview.outputs.branch }}
          publish_dir: ./preview
          force_orphan: true
          enable_jekyll: false
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Orbis public preview: $PREVIEW_URL\n\nThis preview is published from the successful read-only PR artifact; PR code never receives a write token."
