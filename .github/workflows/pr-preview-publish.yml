name: Orbis PR Preview Publish

on:
  workflow_run:
    workflows: ['Orbis PR Preview Build']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve preview metadata
        id: preview
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo 'No pull request is associated with this workflow run'
            exit 1
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=preview-pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githack.com/${GITHUB_REPOSITORY}/preview-pr-$PR_NUMBER/index.html" >> "$GITHUB_OUTPUT"
      - name: Download trusted build artifact
        uses: actions/download-artifact@v7
        with:
          name: orbis-pr-preview
          path: preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.preview.outputs.branch }}
          publish_dir: ./preview
          force_orphan: true
          enable_jekyll: false
      - name: Verify public preview availability
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          preview_root="${PREVIEW_URL%/index.html}"
          for attempt in $(seq 1 12); do
            if rss="$(curl --fail --silent --show-error --location --max-time 15 "$preview_root/rss.xml")" \
              && grep -q '<rss' <<< "$rss" \
              && curl --fail --silent --show-error --location --max-time 15 "$preview_root/favicon.svg" > /dev/null; then
              echo "Public preview assets are reachable: $PREVIEW_URL"
              exit 0
            fi
            echo "Preview not visible yet (attempt $attempt/12)"
            sleep 5
          done
          echo "Public preview did not become reachable: $PREVIEW_URL" >&2
          exit 1
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          body_file="$(mktemp)"
          printf '%s\n\n%s\n' \
            "Orbis public preview: $PREVIEW_URL" \
            'This preview was rebuilt from the read-only PR artifact and passed a public availability smoke check before this comment was posted.' \
            > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"

      - name: Verify Scheduled Daily auto-merge eligibility
        id: daily-auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          state="$(jq -r '.state' <<< "$pr_json")"
          draft="$(jq -r '.draft' <<< "$pr_json")"
          body="$(jq -r '.body // ""' <<< "$pr_json")"

          eligible=false
          reason=not-scheduled-daily

          if [[ "$head_ref" != automation/daily/* ]]; then
            echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "Auto-merge skipped: head branch is not a Scheduled Daily candidate ($head_ref)"
            exit 0
          fi

          target_date="${head_ref#automation/daily/}"
          expected_path="content/briefs/${target_date}.yaml"

          if [[ ! "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            reason=invalid-daily-branch
          elif [ "$base_ref" != "main" ]; then
            reason=unexpected-base
          elif [ "$state" != "open" ]; then
            reason=pr-not-open
          elif [ "$draft" != "false" ]; then
            reason=pr-is-draft
          elif [ "$head_sha" != "$SOURCE_HEAD_SHA" ]; then
            reason=stale-preview
          elif ! grep -q '<!-- orbis-content-automation:v1 -->' <<< "$body"; then
            reason=missing-automation-marker
          else
            mapfile -t changed_files < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename'
            )
            if [ "${#changed_files[@]}" -ne 1 ]; then
              reason=unexpected-file-count
            elif [ "${changed_files[0]}" != "$expected_path" ]; then
              reason=unexpected-file
            else
              eligible=true
              reason=eligible
            fi
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Scheduled Daily auto-merge eligibility: eligible=$eligible reason=$reason head=$head_ref sha=$head_sha"

      - name: Enable GitHub Auto Merge for Scheduled Daily
        if: ${{ steps.daily-auto-merge.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.preview.outputs.pr }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --match-head-commit "$SOURCE_HEAD_SHA"
          echo "GitHub Auto Merge enabled for Scheduled Daily PR #$PR_NUMBER at $SOURCE_HEAD_SHA"
