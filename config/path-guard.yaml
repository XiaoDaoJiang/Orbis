version: 1

modes:
  pr:
    denyPrefixes:
      - dist/
      - apps/slides/generated/
  content-agent:
    allowPrefixes:
      - content/briefs/
      - content/presentations/
      - content/essays/
      - content/knowledge/
    denyPatterns:
      - '^content/presentations/[^/]+/'
  scheduled-daily:
    allowPrefixes:
      - content/briefs/
