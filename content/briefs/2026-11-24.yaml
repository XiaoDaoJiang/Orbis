{"kind":"brief","cadence":"daily","evidenceVersion":1,"publishedAt":"2026-11-24","status":"published","title":"Agent 工程的双重门禁：能力跃迁与数据边界必须独立验证","summary":"OpenAI 公开预训练交叉熵指标并提议共享安全门槛；OpenRouter 与 Together AI 的披露表明推理端点资格和编码 Agent 凭据需要持续核验。LingSante-3.1-flash 探索医疗长任务，Clover 则以块扩散挑战自回归生成路径。工程上应把模型能力、供应链安全和任务验收分开测量。","topics":["agent-harness","coding-agent"],"tags":["Pretraining Loss","Zero Data Retention","Credential Isolation","Medical Agent Evaluation","Diffusion Language Models"],"signals":[{"title":"能力演进不能只靠下游榜单","summary":"OpenAI 提议以预训练损失等指标建立共享安全门槛；跨实验室比较和任务级安全仍需独立验证。","impact":"high"},{"title":"推理路由与开发凭据必须双重审计","summary":"OpenRouter 移除部分端点的 ZDR 资格，Together AI 披露编码 Agent 提交凭据导致提示词样本泄露。","impact":"high"},{"title":"医疗 Agent 需要任务级证据与人工复核","summary":"LingSante-3.1-flash 面向医疗推理和多阶段工具任务；模型卡明确限制独立临床用途。","impact":"high"},{"title":"扩散式生成进入编码 Agent 的候选架构","summary":"Clover 的作者报告编码基准和生成速度，值得在固定 Harness 中复测端到端成本。","impact":"medium"}],"sections":[{"id":"pretraining-loss","layout":"metrics","title":"预训练损失：能力预警不是部署通行证","conclusion":"将通用预训练指标作为风险预警，与任务、权限及红队测试分别设门禁。","facts":[{"id":"loss-disclosure","text":"OpenAI 11 月 22 日披露固定内部代码库评测集上的 log-perplexity：GPT-3.5 约 0.99，GPT-4 约 0.91。","evidence":["openai-loss"]},{"id":"emergence-observation","text":"作者称在损失低于 0.8 时观察到网络安全与数学能力变化，并在约 0.76 时观察到开放数学问题突破。","evidence":["openai-loss"]},{"id":"shared-limits-proposal","text":"作者建议以困惑度等共享指标设定开发限制，直到行为监控达到明确里程碑。","evidence":["openai-loss"]}],"limitations":["这些阈值来自特定数据集和作者观察，并非普适定律；提议也不等于行业标准已经生效。"]},{"id":"routing-policy","layout":"system-map","title":"ZDR 资格：从静态标签转向持续核验","conclusion":"为每个供应商端点记录保留政策、实际路由和变更记录；安全要求不满足时禁止自动降级。","facts":[{"id":"provider-removal","text":"OpenRouter 11 月 22 日公告称已移除三家供应商，并撤销 125 个端点的 Zero Data Retention 资格。","evidence":["openrouter-incident"]},{"id":"scope-distinction","text":"OpenRouter 表示现有发现涉及特定推理供应商，未显示 OpenRouter 自身遭未授权访问；部分端点为预防性移除。","evidence":["openrouter-incident"]},{"id":"continuous-verification","text":"平台正推进持续检测、网络路径技术核验，以及恢复 ZDR 资格前的验证要求。","evidence":["openrouter-incident"]}],"limitations":["公告不等于所有端点的数据路径已获独立审计，也不能把撤销资格数量等同于实际泄露数量。"]},{"id":"coding-credential-boundary","layout":"architecture","title":"编码 Agent 的凭据边界不能依赖事后扫描","conclusion":"隔离工作区与生产凭据，限定短期授权，并在提交及推送之前检测敏感数据。","facts":[{"id":"together-sample-exposure","text":"Together AI 11 月 21 日公告称部分 6 至 7 月推理提示词样本遭未经授权下载。","evidence":["together-incident"]},{"id":"agent-credential-commit","text":"该公司称编码 Agent 将可访问私有样本仓库的凭据提交到公开代码仓库；扫描发现后撤回提交，但暴露期间凭据已被取得。","evidence":["together-incident"]},{"id":"credential-control-updates","text":"Together AI 宣布加强短期或限域凭据、PR 凭据检查，并为新账户默认启用 ZDR。","evidence":["together-incident"]}],"limitations":["受影响样本内容的调查仍在继续，不能据此推断所有客户或所有请求均受影响。"]},{"id":"medical-workflow","layout":"architecture","title":"LingSante：领域 Agent 从问答走向任务验收","conclusion":"用合成病例、证据引用一致性、任务回放和人工审核评估医疗工作流，禁止独立临床决策。","facts":[{"id":"lingsante-scale","text":"LingSante-3.1-flash 模型卡列出 560B 总参数、25B 激活参数、1M token 上下文以及 MIT 许可证。","evidence":["lingsante-card"]},{"id":"lingsante-workflows","text":"模型卡描述面向医疗推理、搜索、工具使用及多阶段任务的训练，并提供 SGLang 与 vLLM 部署示例。","evidence":["lingsante-card"]},{"id":"lingsante-research-only","text":"模型卡明确仅用于研究和评估，不能作为独立诊断、处方或治疗依据；模拟评测不证明临床有效性。","evidence":["lingsante-card"]}],"limitations":["长上下文不能保证完整检索，且官方部署示例需要多卡资源；应核验隐私、成本及领域适用性。"]},{"id":"block-diffusion","layout":"comparison","title":"Clover：用端到端任务成本检验块扩散","conclusion":"在相同硬件、工具集与测试用例下比较任务完成率、首 token 延迟、生成速度和总耗时。","facts":[{"id":"clover-architecture","text":"11 月 18 日提交的 Clover 技术报告描述 35B 总参数、3B 激活参数的 MoE，以历史循环记忆和块内双向注意力实现块扩散。","evidence":["clover-report"]},{"id":"clover-reported-results","text":"报告作者给出 SWE-bench Verified 73.6、Terminal-Bench 2.1 51.7，并在单张 GB300、BF16、batch=1 的内部 Agent 负载报告 680 token/s。","evidence":["clover-report"]},{"id":"clover-open-weights","text":"Clover 模型卡列出 Apache 2.0 许可证，并提供 Transformers 等推理入口；示例含自定义模型代码。","evidence":["clover-card"]}],"limitations":["作为近期技术延伸阅读，论文早于本期发现窗口；作者速度数据不等于所有硬件或真实长任务的吞吐。"]}],"projects":[{"action":"READ","name":"OpenRouter Incident","summary":"核查端点资格变化与供应商验证措施。","maturity":"stable","url":"https://openrouter.ai/blog/announcements/data-processing-incidents-on-inference-providers/"},{"action":"TEST","name":"LingSante-3.1-flash","summary":"使用合成材料验证检索、证据绑定和人工审核接口。","maturity":"early","url":"https://huggingface.co/inclusionAI/LingSante-3.1-flash"},{"action":"TEST","name":"Clover-35B-A3B-Preview","summary":"在隔离环境复测扩散模型的编码任务和总运行时间。","maturity":"experimental","url":"https://huggingface.co/Diffuspace/Clover-35B-A3B-Preview"}],"radar":[{"label":"端点 ZDR 持续核验","impact":95,"horizon":95,"note":"涉及生产数据路径，应优先建立策略和审计记录。"},{"label":"编码 Agent 凭据隔离","impact":96,"horizon":95,"note":"可立即加入最小权限与推送前检查。"},{"label":"块扩散编码模型","impact":80,"horizon":65,"note":"先进行固定用例实验，避免把厂商速度直接外推。"}],"actions":[{"title":"建立模型版本独立验收门禁","description":"固定任务集、权限测试与红队样本，分别记录能力和安全结果。"},{"title":"建立供应商端点策略清单","description":"保存端点标识、ZDR 状态、路由和变更时间，禁止不合规回退。"},{"title":"隔离 Agent 凭据与公开仓库","description":"仅发放短期限域凭据，并在提交推送前扫描；演练凭据泄露后的撤销。"},{"title":"复测领域模型与扩散模型","description":"用合成病例或固定编码任务测成功率、证据准确性、资源与总耗时。"}],"references":[{"id":"openai-loss","title":"OpenAI — Perplexity and Intelligence","url":"https://openai.com/index/perplexity-and-intelligence/","supports":"内部损失指标、作者观察、共享开发限制提议及局限。","accessedAt":"2026-11-24"},{"id":"openrouter-incident","title":"OpenRouter — Data Processing Incidents on Inference Providers","url":"https://openrouter.ai/blog/announcements/data-processing-incidents-on-inference-providers/","supports":"供应商移除、ZDR 资格撤销、持续核验与公告范围。","accessedAt":"2026-11-24"},{"id":"together-incident","title":"Together AI — Security event: Prompt leakage","url":"https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026","supports":"提示词样本暴露、凭据提交与后续安全措施。","accessedAt":"2026-11-24"},{"id":"lingsante-card","title":"inclusionAI — LingSante-3.1-flash model card","url":"https://huggingface.co/inclusionAI/LingSante-3.1-flash","supports":"模型参数、许可证、部署、任务训练与用途限制。","accessedAt":"2026-11-24"},{"id":"clover-report","title":"DiffuSpace — Clover-35B-A3B-Preview Technical Report","url":"https://arxiv.org/abs/2611.24636","supports":"论文日期、模型架构及作者报告的基准和速度。","accessedAt":"2026-11-24"},{"id":"clover-card","title":"DiffuSpace — Clover-35B-A3B-Preview model card","url":"https://huggingface.co/Diffuspace/Clover-35B-A3B-Preview","supports":"开放权重、许可证和推理接口。","accessedAt":"2026-11-24"}],"archivePicks":[{"title":"Orbis · 2026-11-23 — 可信 Agent 的执行边界","url":"https://github.com/XiaoDaoJiang/Orbis/blob/main/content/briefs/2026-11-23.yaml","supports":"延伸阅读模型路由、权限隔离与独立验证。","publishedAt":"2026-11-23"}],"corrections":[],"presentation":{"enabled":true,"template":"daily-v1"}}