  "title": "Agent 运行时的可组合时代：工具 API、脚本编排与安全契约",
  "summary": "DeepSeek 将检索、网页、文件和语音能力拆为可组合的 API；Google Antigravity 将并行 Agent 流程交给可审查的 Python 脚本。Anthropic Anvil 展示多轮自适应红队的验证价值；llama.cpp v1.0.0 为本地推理库明确版本兼容规则；Poppy 1.0 则分离跨企业代理的发现、会话身份与 OAuth 授权。工程化重点正从单次模型输出转向可计费、可隔离、可复现、可升级的能力调用。",
