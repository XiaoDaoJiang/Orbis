    maturity: growing
    url: https://blog.jetbrains.com/junie/2026/09/smarter-local-al/
radar:
  - label: Open pluggable agent harness
    impact: 95
    horizon: 8
    note: Harness 开源并支持多 provider 后，模型选择、工具层和宿主入口第一次可以被独立替换和验证。
  - label: Portable AGENTS.md contract
    impact: 94
    horizon: 6
    note: 多个 Coding Agent 读取同一仓库级指令文件，可显著降低项目规则在不同 Harness 之间重复维护的成本。
  - label: Protocol-level MCP authorization
    impact: 98
    horizon: 8
    note: 当 Agent 开始操作真实 SaaS 与内部系统，OAuth scope、resource binding 和 token verification 会直接决定副作用边界。
  - label: Embedded continuous evaluation
    impact: 90
    horizon: 24
    note: evaluator 更接近训练与部署流程能增加可检查性，但独立性、访问范围和报告标准仍在形成。
  - label: Local agent runtime co-design
    impact: 92
    horizon: 14
    note: 本地 Coding Agent 的体验越来越取决于模型、解码 Runtime、硬件和 Agent benchmark 的联合优化。
actions:
  - title: 把项目约定收敛到可移植指令层
    description: 优先维护 AGENTS.md 等仓库级工程契约，并明确与产品私有指令文件的覆盖关系，再验证主要 Coding Agent 对嵌套规则的实际行为。
  - title: 为 Harness 建立 provider contract tests
    description: 用同一组读写、工具调用、错误恢复和长上下文任务测试不同模型 API，避免把 OpenAI/Anthropic 兼容接口误当成行为完全等价。
  - title: 把 MCP OAuth 当成工具上线门禁
    description: 对带用户数据或写操作的 MCP server 检查 PKCE、resource/audience、scope、token 验证和重新授权路径，并把权限失败纳入自动化测试。
  - title: 将 Eval 接近真实 Runtime
    description: 除模型分数外，同时记录 Harness、工具、权限、硬件、token 与延迟条件，让 Agent 评测能够解释真实生产环境中的能力和成本。
