  "title": "Agent 能力进入分层验证期：循环推理、开放多模态、状态完整性与蒸馏防护",
  "summary": "Thinking Machines Inkling 2 Mini 通过循环 Transformer 和低比特权重探索本地 Agent 推理效率，但更短的显式思维链要求重新审视可监控性。腾讯 WeMM-Video 与 Hy4 分别推进视频音画理解和超大 MoE 模型，推理成本与许可证成为落地约束。OpenAI API 文档强调保持历史前缀不变，以保留跨轮 reasoning；其蒸馏防御研究进一步说明敏感推理轨迹需要独立保护。MedChemBench 将专业领域推理拆成可核验的子任务，提醒工程团队不要用单一榜单替代任务级验收。",
