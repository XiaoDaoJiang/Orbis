radar:
  - label: Physical closed-loop agents
    impact: 97
    horizon: 18
    note: Agent 一旦能影响真实设备，停止条件、操作范围和人工接管就成为上线前基础能力。
  - label: Massive agent orchestration
    impact: 98
    horizon: 22
    note: 万级并发将调度、预算、汇聚与故障隔离从实现细节升级为核心系统问题。
  - label: Formal verification artifacts
    impact: 95
    horizon: 20
    note: 高价值推理结果规模越大，机器可检查 proof 与 provenance 越需要同步进入交付链。
  - label: Memory and identity runtime APIs
    impact: 93
    horizon: 16
    note: 长期 Agent 使用持久 Memory 和高风险操作后，需要显式 readiness、版本和身份确认边界。
  - label: Isolated permission runtime
    impact: 97
    horizon: 14
    note: 浏览器、凭据和外部写入进入 Agent 后，应优先把权限裁决和秘密材料移到模型进程之外。
actions:
  - title: 为物理或高副作用 Tool 定义闭环安全包络
    description: 对每个可影响真实系统的动作声明允许参数、停止条件、超时、回滚或人工接管点，并把这些限制放到 Harness 而不是 Prompt。
  - title: 给多 Agent 编排增加预算与证据流水线
    description: 同时记录并发规模、token 与工具预算、失败隔离、结果汇聚和验证工件，让扩大 Agent 数量不会脱离可审计成本与质量边界。
  - title: 把 Memory 与身份确认做成 Runtime API
    description: 显式暴露 Memory version、readiness 与 reset 状态，并把高风险操作的用户验证、取消与失败原因放到独立协议层。
  - title: 把凭据与外部权限移出 Agent 主进程
    description: 让 Agent 只提交意图，由独立 policy service 决定 connector、egress 和敏感动作；真实凭据通过代理按需注入，并把批准绑定到精确作用域。
