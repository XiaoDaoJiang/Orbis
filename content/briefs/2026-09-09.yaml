  - label: Formal evidence artifacts
    impact: 94
    horizon: 24
    note: 科学与高风险推理输出越复杂，机器可检查证明与 provenance 越有价值。
  - label: Memory readiness contract
    impact: 91
    horizon: 16
    note: 长期 Agent 使用持久 Memory 后，需要明确版本、就绪状态和注入边界。
  - label: User verification boundary
    impact: 93
    horizon: 20
    note: 高风险操作需要把身份确认从模型判断中剥离成独立可取消协议。
  - label: Safe no-op automation
    impact: 88
    horizon: 10
    note: 高频 scheduled Agent 必须把无变化时不写入作为正常且可审计的结果。
actions:
  - title: 为物理或高副作用 Tool 定义闭环安全包络
    description: 对每个可影响真实系统的动作声明允许参数、停止条件、超时、回滚或人工接管点，并把这些限制放到 Harness 而不是 Prompt。
  - title: 让高价值结论同时产出可验证工件
    description: 对研究、迁移和架构决策保留结构化 evidence、测试、形式化检查或可重放实验，让 Reviewer 能独立验证关键结论。
  - title: 把 Memory 与身份确认做成 Runtime API
    description: 显式暴露 Memory version、readiness 与 reset 状态，并把高风险操作的用户验证、取消与失败原因放到独立协议层。
  - title: 把 No-op 纳入 Scheduled Agent 成功合同
    description: 先做缓存与廉价预检，只在真实变化时写入；同时记录失败、被防火墙阻断和检查覆盖，避免为了产出而制造噪声。
