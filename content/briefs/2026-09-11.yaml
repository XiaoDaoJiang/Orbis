actions:
  - title: 把 Agent Runtime 能力从模型配置中拆出来
    description: 为 context management、tool discovery、multi-agent、sandbox 与 session lifecycle 建立独立能力矩阵，避免把 Runtime 差异误认为模型差异。
  - title: 为长期任务增加 Project-level 控制面实验
    description: 选择一个跨多日的真实开发任务，验证共享上下文、事件触发、Coordinator 与多个执行 Agent 的职责边界和恢复成本。
  - title: 用步骤数和成本补充 Coding Agent 成功率
    description: 在现有代码任务评测中同时记录首次编辑时间、总工具调用、总步骤、token 与实际费用，观察更高成功率是否伴随可接受的执行成本。
  - title: 验证 Model 与 Harness 的组合而不是单测模型
    description: 对同一任务固定仓库与验收标准，交叉测试不同模型和 Harness，比较长上下文、Steer、Session 恢复与 Tool contract 对结果的影响。
