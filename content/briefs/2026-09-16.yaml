actions:
  - title: 给 CI 按 10 至 25 倍峰值做容量演练
    description: 在 Coding Agent 扩容前模拟 PR、测试与结果事件的数量级增长，验证 test selection、队列、状态存储和 worker 横向扩展是否存在单点瓶颈。
  - title: 把 Agent 上线条件写成可审查合同
    description: 为每个生产 Agent 固定 user、task、output、quality threshold、TCO owner 与 oversight tier，并把这些字段纳入上线评审。
  - title: 将 Workspace 与 Session 从 UI 中解耦
    description: 让 Desktop、CLI、IDE 和 scheduled run 共享稳定的 task/session identity，并显式定义 checkpoint、并发写入与恢复语义。
  - title: 对可写 MCP 使用最小权限与审批
    description: 默认以只读 scope 接入外部 SaaS，写操作按资源和动作分级，并为删除、发布或生产配置变更加人工审批和审计记录。
