title: Agent 生产化进入第二阶段，CI、权限与成本控制面开始重构
summary: 当 Agent 显著加速代码与任务执行后，新的瓶颈开始集中到 CI、治理、客户端形态、外部权限和运行成本：Anthropic 的工程数据展示了 CI 负载如何随 Agent 使用快速膨胀，Cline、ElevenLabs 与 Bolt 则分别把 Agent 从 IDE 中解耦、把 SaaS 写权限放进托管 MCP，以及把模型成本与训练数据交换做成显式产品机制。
topics:
  - agent-harness
  - coding-agent
signals:
  - title: Agent 加速正在把瓶颈推向 CI 与验证基础设施
    summary: Anthropic 报告代码产出与测试规模快速增长后，CI job 在半年内增长 25 倍，说明生成与评审提速之后，验证系统本身会成为新的吞吐上限。
    impact: high
  - title: 生产落地需要先定义任务、质量阈值与人工监督
    summary: Anthropic 与 Accenture 的生产化蓝图把 user、task、output、quality threshold、TCO 和分级 oversight 前置，说明 Agent 上线需要独立于模型能力的治理合同。
    impact: high
  - title: Agent Harness 正脱离 IDE 并跨客户端保持连续状态
    summary: Cline Desktop 复用同一开源 Harness，在原生桌面、CLI、扩展与 scheduled runs 之间统一会话入口，Agent 的工作单元开始从编辑器插件扩展为独立 Workspace Runtime。
    impact: high
  - title: 外部系统正在通过 MCP 暴露受控写权限
    summary: ElevenLabs 将 workspace 管理能力封装为托管 MCP，以 OAuth、可撤销权限和从只读到完整管理的 scope 控制 Agent 对生产对象的操作。
    impact: high
sections:
  - id: ci-becomes-agent-bottleneck
    layout: metrics
    title: Coding Agent 的下一处瓶颈是 CI 吞吐
    conclusion: 当代码生成、评审与 PR 数量被 Agent 同时加速时，验证基础设施必须按远高于历史增长率设计，否则 Agent 只是把交付瓶颈从编码阶段搬到测试阶段。
    facts:
      - id: anthropic-code-output-eight-x
        text: Anthropic 表示其工程师每季度交付的代码量平均达到 2021 至 2025 年水平的 8 倍，其中 Claude 编写约 80% 的代码。
        evidence: [anthropic-agentic-ci]
      - id: anthropic-ci-jobs-twenty-five-x
        text: Anthropic 报告测试数量增长约 10 倍，同时 CI job volume 在六个月内增长 25 倍。
        evidence: [anthropic-agentic-ci]
      - id: deterministic-test-impact-analysis
        text: Anthropic 的 test impact analysis 使用 listener 记录 CI 结果、selector 根据历史结果与 package relevance 决定每个 PR 需要运行的测试。
        evidence: [anthropic-agentic-ci]
      - id: stateless-horizontal-redesign
        text: 在多次临时扩容失效后，Anthropic 将 listener 改为可水平扩展的无状态 worker，并把结果追加到独立数据存储中的 journal，再由消费者聚合测试历史。
        evidence: [anthropic-agentic-ci]
    limitations:
      - 8 倍代码产出、80% Claude 编写比例和 25 倍 CI 增长来自 Anthropic 自身工程环境，不能直接外推为其他团队的固定增长倍率。
      - Test impact analysis 依赖历史测试结果和 package relevance，仍需要防止选择逻辑遗漏真实回归。
  - id: production-governance-contract
    layout: system-map
    title: Agent 生产化需要独立于模型的治理合同
    conclusion: 生产 Agent 不能只以“模型效果不错”作为上线条件；任务定义、质量阈值、成本责任与人工监督级别需要在 Pilot 之前就成为可审查的系统合同。
    facts:
      - id: four-part-job-definition
        text: Anthropic 与 Accenture 的生产化指南要求用 user、task、output 与 measurable quality threshold 四部分明确 AI 要完成的工作。
        evidence: [anthropic-pilot-production]
      - id: tco-before-pilot
        text: 该指南建议在 Pilot 之前建立轻量 total cost of ownership 模型，而不是等规模化之后再补成本核算。
        evidence: [anthropic-pilot-production]
      - id: four-tier-oversight
        text: 指南提供 automated、sampled、reviewed 与 advisory 四级 oversight 模型，用不同人工审核频率匹配输出风险。
        evidence: [anthropic-pilot-production]
      - id: ownership-transition-blueprint
        text: 指南同时要求明确每一阶段需要做出的决策与责任人，把从 Pilot 到 Production 的推进设计成有 owner 的治理流程。
        evidence: [anthropic-pilot-production]
    limitations:
      - 该蓝图主要面向企业 AI 项目治理，具体阈值仍需根据业务风险、法规和故障成本重新定义。
      - 明确责任和监督层级并不能替代任务级自动化测试、权限隔离和运行时可观测性。
  - id: harness-outside-editor
    layout: architecture
    title: Agent Harness 正从 IDE 插件变成独立 Workspace Runtime
    conclusion: 当同一 Harness 可以脱离编辑器运行，并在桌面、CLI、扩展与定时任务之间统一会话历史时，Agent 的持久状态与 Workspace 生命周期应该由 Runtime 管理，而不是绑定某个 UI。
    facts:
      - id: cline-desktop-standalone
        text: Cline for Desktop Beta 是原生桌面应用，可直接打开 workspace 让 Agent 读取、编辑和运行代码，不需要启动 VS Code。
        evidence: [cline-desktop]
      - id: same-harness-any-provider
        text: Cline Desktop 使用与 IDE 和 CLI 相同的开源 Cline Harness，并允许连接 Anthropic、OpenAI、Gemini、open-weight model 或本地 endpoint，且可在项目中切换模型。
        evidence: [cline-desktop]
      - id: cross-surface-session-history
        text: Cline Desktop 的 session history 汇总桌面应用、CLI、扩展和 scheduled runs 产生的会话，并可按来源过滤。
        evidence: [cline-desktop]
      - id: fork-rewinds-workspace
        text: Cline Desktop 支持编辑较早消息后 fork session，并将 workspace 回退到对应 checkpoint 后从修改后的 prompt 重新执行。
        evidence: [cline-desktop]
    limitations:
      - Cline Desktop 当前仍是 Beta，官方明确提示构建频繁且存在 rough edges。
      - 跨客户端共享会话并不自动解决 workspace 并发修改、凭据边界和不同 Runtime 能力不一致的问题。
  - id: hosted-mcp-permission-plane
    layout: architecture
    title: 托管 MCP 正把 SaaS 写权限变成可授权的 Agent 能力
    conclusion: 当 MCP 从本地工具桥接升级为托管服务后，身份、scope、撤销、成本预估和生产变更权限都必须成为 Connector 自身的控制面，而不能交给 Prompt 约束。
    facts:
      - id: elevenlabs-hosted-mcp
        text: ElevenLabs 提供托管 MCP server，将 ElevenLabs workspace 连接到 Claude、Claude Code、ChatGPT、Cursor 等助手，并由服务端维护连接。
        evidence: [elevenlabs-mcp]
      - id: oauth-without-api-keys
        text: ElevenLabs MCP 使用 OAuth 登录，官方说明无需向 Agent 配置 API key，授权可撤销并限制在用户 workspace 范围内。
        evidence: [elevenlabs-mcp]
      - id: permission-scope-control
        text: ElevenLabs 允许用户控制 Connector 权限，从只读 monitoring 到完整 agent management。
        evidence: [elevenlabs-mcp]
      - id: manage-and-estimate-before-ship
        text: 通过该 MCP，助手可以创建、修改、复制或删除 voice/chat agents，并可在应用变更到生产前估算 LLM usage 与成本。
        evidence: [elevenlabs-mcp]
    limitations:
      - MCP 暴露写权限后，错误配置会直接影响生产 Agent，因此高副作用操作仍应增加审批、审计和环境隔离。
      - OAuth 降低静态 API key 暴露风险，但不能替代最小权限、会话撤销和服务端 policy enforcement。
  - id: open-agent-cost-data-loop
    layout: comparison
    title: Agent 成本优化开始与训练数据交换绑定
    conclusion: Bolt Forge 展示了一种新的 Agent 经济模型：将 open-model 路由、专用推理容量、浏览器 Runtime 与显式数据同意组合起来，用更低边际成本换取更大的实验预算，同时把隐私边界做成用户可见选择。
    facts:
      - id: forge-is-agent-not-model
        text: Bolt 明确将 Forge 定义为 Agent 而不是单一模型；它在同一个 Agent 入口中运行多种 open models，并允许用户切换具体模型。
        evidence: [bolt-forge]
      - id: explicit-opt-in-training-data
        text: 用户每次切换到 Forge 都需要显式 opt in；Bolt 表示会在数据离开其基础设施前去除 secrets、敏感信息和个人信息，再将共享 session 用于与 Arcee AI 的 open-weight model 训练。
        evidence: [bolt-forge]
      - id: reserved-capacity-browser-runtime
        text: Bolt 表示 Forge 使用专用 reserved hardware，并让项目运行在浏览器内 WebContainers，以固定推理容量和客户端 Runtime 降低整体成本结构。
        evidence: [bolt-forge]
      - id: experimental-production-boundary
        text: Bolt 将 Forge 中的 open models 标记为 experimental，并建议复杂生产项目继续使用 Standard 或 Max Agent。
        evidence: [bolt-forge]
    limitations:
      - Bolt Build Index 与 50 倍 usage 等指标属于厂商自有产品和成本模型，不能直接视为跨平台基准。
      - 匿名化与 secret stripping 降低数据风险，但 opted-in session 仍涉及真实开发轨迹，团队环境需要额外的数据治理评估。
