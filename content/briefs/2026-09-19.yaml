actions:
- title: 把并行 Agent 分支当成受控执行单元
  description: 为每个 worker 绑定独立 workspace、branch、测试结果和合并依赖，协调器只负责路由、汇总和冲突处理。
- title: 为联网工具保存 provenance
  description: 记录查询条件、时间窗、来源 URL、抓取模式和最终进入上下文的片段，避免把“搜索到了”与“事实已核验”混为一谈。
- title: 把高风险权限改成有期限的 capability grant
  description: 对敏感工具或副作用操作绑定主体、用途、资源范围、有效期与审计策略，并跨 session 检查是否偏离授权目标。
- title: 给 Eval 增加 harness 与 scorer 审计
  description: 在记录 benchmark 分数之外固定模型参数、token/时间预算、工具权限、scaffold、scorer 版本和失败样本，避免不可比较的排行榜驱动决策。
