{"kind":"brief","cadence":"daily","evidenceVersion":1,"publishedAt":"2026-11-27","status":"published","title":"Agent 工程走向可验证迁移、可交付产物与受控推理","summary":"Anthropic 的 Rust 迁移表明生产验证比生成更难；ShellBench 揭示证据保留与重复成功率的缺口。Bonsai、Nemotron 与 Private Intelligence 则提示分别验证本地资源、产物质量和数据边界。","topics":["agent-harness","coding-agent"],"tags":["Shadow Traffic","Agent Evaluation","Ternary Quantization","Artifact Verification","Confidential Computing"],"signals":[{"title":"迁移瓶颈转向验证","summary":"Anthropic 以生产 API 为参照，借助影子流量验证 Agent 修复。","impact":"high"},{"title":"正确答案不等于完整交付","summary":"ShellBench 要求证据和安全条件同时成立，并比较重复运行结果。","impact":"high"},{"title":"本地推理需要任务级复测","summary":"Bonsai 2.5 保持紧凑权重体积，Private Inference 探索另一条数据保护路线。","impact":"high"},{"title":"可编辑产物需要渲染验收","summary":"Nemotron 研究将生成、渲染审计与有限修复循环分离。","impact":"medium"}],"sections":[{"id":"rust-migration","layout":"architecture","title":"Rust 迁移：用旧系统验证新系统","conclusion":"建立差异指纹与影子流量验收，让人工判断集中在正确性定义和部署关卡。","facts":[{"id":"initial-code","text":"Anthropic 11 月 25 日披露，Claude 约一周完成 Messages API 核心请求路径首版。","evidence":["rust"]},{"id":"verification-loop","text":"团队以旧 API 对照新实现，Agent 在本地沙箱复现差异，工程师审核后通过影子流量检查修复。","evidence":["rust"]},{"id":"measured-outcome","text":"官方报告迁移后每请求 CPU 用量约降 70%，首 token 中位延迟约降 20%，未中断服务。","evidence":["rust"]}],"limitations":["实际迁移早于文章发布日期；该案例不能证明任意代码迁移都具有相同收益。"]},{"id":"shellbench","layout":"metrics","title":"ShellBench：证据完整性与重复成功","conclusion":"为任务定义可检查的证据交付，并报告单次和重复成功率。","facts":[{"id":"scope","text":"11 月 24 日公布的 ShellBench 覆盖 100 项任务、12 个模型、5 种 Harness，共 53100 次评分运行。","evidence":["shell"]},{"id":"evidence-gap","text":"在一项餐厅选择任务中，522/531 次选对餐厅，但 331 次仅因缺少支持预算或时间的文件引用而未通过。","evidence":["shell"]},{"id":"repeat-gap","text":"作者报告 GPT-6 Astra 三次中至少成功一次为 75.1%，三次均成功为 48.8%。","evidence":["shell"]}],"limitations":["作为本期发现的近期研究，发布日期早于 48 小时窗口；单次评分也可能引入裁判波动。"]},{"id":"ternary-local","layout":"comparison","title":"Bonsai 2.5：压缩后仍需检验长任务","conclusion":"用同一 Harness 比较压缩前后的工具调用可靠性、峰值资源和完成成本。","facts":[{"id":"footprint","text":"PrismML 于 11 月 24 日公布基于 Qwen3.8 27B 的三值 Bonsai 2.5 27B，报告模型体积为 5.9 GB。","evidence":["bonsai"]},{"id":"reported-eval","text":"厂商报告 SWE-bench Verified 从上一版 60.8 升至 75.6，AppWorld 从 51.2 升至 90.5。","evidence":["bonsai"]},{"id":"availability","text":"官方提供 Apache 2.0 权重，并列出 llama.cpp 与 MLX 推理路径。","evidence":["bonsai"]}],"limitations":["近期发现的发布早于 48 小时窗口；模型文件体积不等于包含 KV cache 的峰值显存，厂商评测需复测。"]},{"id":"visual-artifact","layout":"system-map","title":"Nemotron：把渲染结果纳入验收","conclusion":"先冻结布局与需求，再检查实际渲染产物，而非只验证生成代码。","facts":[{"id":"representation","text":"NVIDIA 模型卡描述将视觉 token 与 SVG、HTML/CSS 等显式结构纳入统一视觉创作框架。","evidence":["nemotron"]},{"id":"repair-contract","text":"浏览器创作路径在生成前冻结布局约束，使用渲染检查、视觉审计和有限修复循环。","evidence":["nemotron"]},{"id":"release-scope","text":"首批发布包含 30B 总参数、3B 激活参数的图像模型及 tokenizer；Harness 和 VisionCode 仍待法律批准。","evidence":["nemotron"]}],"limitations":["模型卡采用 NVIDIA 许可证，不能把当前权重开放等同于完整框架开源。"]},{"id":"private-inference","layout":"architecture","title":"Private Intelligence：推理保护仍需验证","conclusion":"将推理隔离、数据留存、人工访问和工具外发权限作为不同准入项。","facts":[{"id":"safety-processing","text":"OpenAI 的意向登记页描述 ZDR 与 Private Safety Processing 组合，用于不向员工开放底层内容的自动安全检查。","evidence":["private"]},{"id":"preview","text":"页面将 Private Inference 标记为预览，并描述其结合机密计算与可验证控制。","evidence":["private"]},{"id":"registration","text":"目前该页面提供组织意向登记，要求填写组织信息与隐私需求。","evidence":["private"]}],"limitations":["登记页未给出完整技术威胁模型、可用范围与价格，不代表已普遍开放或可免除企业数据审批。"]}],"projects":[{"action":"READ","name":"ShellBench","summary":"研究任务证据要求、重复运行和裁判误差。","maturity":"early","url":"https://openclaw.ai/blog/shellbench"},{"action":"TEST","name":"Bonsai 2.5 27B","summary":"用非敏感仓库复测端到端任务质量和峰值资源。","maturity":"early","url":"https://prismml.com/news/bonsai-2-5-27b"},{"action":"READ","name":"Nemotron-Labs-VisualCreation","summary":"研究渲染审计、布局约束与发布边界。","maturity":"experimental","url":"https://huggingface.co/nvidia/Nemotron-Labs-Image-30B-A3B"}],"radar":[{"label":"生产行为差异验证","impact":95,"horizon":20,"note":"优先为关键迁移设计可重放的差异验收。"},{"label":"证据完整性与重复成功率","impact":92,"horizon":20,"note":"把证据和重复验收加入 Agent 任务合同。"},{"label":"本地及机密推理","impact":86,"horizon":55,"note":"先核验实际数据路径和资源约束。"}],"actions":[{"title":"试点影子验证","description":"挑选只读接口，以合成或批准的流量对照新旧实现并记录差异指纹。"},{"title":"扩充 Agent 验收器","description":"固定任务、证据字段与安全断言，至少重复三次并记录失败类型。"},{"title":"复测本地模型","description":"固定工具集，记录成功率、峰值显存、总耗时与工具失败后的恢复结果。"},{"title":"建立产物与数据双门禁","description":"检查实际渲染结果、源文件可编辑性及外发授权；机密推理未验证前不导入敏感资料。"}],"references":[{"id":"rust","title":"Migrating our Messages API to Rust","url":"https://www.anthropic.com/research/migrating-api-to-rust","supports":"迁移过程、差异验证与官方性能数据。","accessedAt":"2026-11-27"},{"id":"shell","title":"Introducing ShellBench","url":"https://openclaw.ai/blog/shellbench","supports":"任务范围、证据验收及重复运行结果。","accessedAt":"2026-11-27"},{"id":"bonsai","title":"Introducing Ternary Bonsai 2.5 27B","url":"https://prismml.com/news/bonsai-2-5-27b","supports":"三值模型体积、评测与许可证。","accessedAt":"2026-11-27"},{"id":"nemotron","title":"Nemotron-Labs-Image-30B-A3B model card","url":"https://huggingface.co/nvidia/Nemotron-Labs-Image-30B-A3B","supports":"视觉创作框架、渲染循环及发布范围。","accessedAt":"2026-11-27"},{"id":"private","title":"Register your interest in Private Intelligence","url":"https://openai.com/form/private-intelligence-interest/","supports":"意向登记、私密安全处理与预览状态。","accessedAt":"2026-11-27"}],"archivePicks":[{"title":"Orbis · 2026-11-26 — Agent 工程走向可恢复执行与重复可靠性","url":"https://github.com/XiaoDaoJiang/Orbis/blob/main/content/briefs/2026-11-26.yaml","supports":"对照任务状态、独立验收和重复测试。","publishedAt":"2026-11-26"}],"corrections":[],"presentation":{"enabled":true,"template":"daily-v1"}}