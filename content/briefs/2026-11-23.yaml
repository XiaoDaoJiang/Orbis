  "title": "可信 Agent 需要可追溯的执行边界：推理路由、上下文分叉、形式化验证与交易授权",
  "summary": "Novita 的 MiniMax 请求转发事件揭示：模型名称相同不代表数据处理路径一致，供应商路由与保留策略必须可审计。Google Antigravity 的 /btw 支持并行上下文分叉，但只读提示并非独立沙箱。Lean/Mathlib 社区对黎曼假设形式化证明开展了声明比对、隔离重建和多内核复核。OpenAI 的商家身份与 Wallet 支付流程进一步显示，Agent 在外部系统执行有副作用的动作，需要独立身份、最小授权和逐次确认。",
