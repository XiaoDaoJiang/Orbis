{"kind":"brief","cadence":"daily","evidenceVersion":1,"publishedAt":"2026-11-25","status":"published","title":"Agent 执行闭环：把修复、授权、数据访问与验证拆开","summary":"Claude Ship 将 PR 审查、修复和批准分工；Shirudo 用 eBPF 探索不停机临时防护；Gemini API 支持按需文件切片；EFS 与 Lean 研究分别展示跨请求监测和独立证明。工程团队应将执行能力与授权、验收及数据控制分别设计。","topics":["agent-harness","coding-agent"],"tags":["eBPF","PR Automation","Data Governance","Context Engineering","Formal Verification"],"signals":[{"title":"交付角色拆分","summary":"Claude Ship 将审查、修复与批准分离，最终合并仍受仓库规则约束。","impact":"high"},{"title":"不停机防护","summary":"Shirudo 允许测试并签名部署临时 eBPF 防护，正式补丁仍须跟进。","impact":"high"},{"title":"按需上下文","summary":"Gemini 文件切片让 Agent 只处理所需页面、单元格或媒体区间。","impact":"medium"},{"title":"验证与数据控制","summary":"EFS 探索客户控制存储的跨请求监测；DeepMind 用 Lean 检验 Agent 生成的算法。","impact":"high"}],"sections":[{"id":"pr-governance","layout":"architecture","title":"PR 自动化：修复者不等于批准者","conclusion":"将修复循环与批准策略分离，再由 GitHub 规则决定合并。","facts":[{"id":"role-split","text":"11 月 23 日发布的 Claude Ship 包含 Code Review、PR Steward 和 Claude Approvals；后两者处于 beta。","evidence":["ship"]},{"id":"steward-boundary","text":"PR Steward 处理失败检查、冲突与反馈，但不负责批准或合并。","evidence":["ship","ship-docs"]},{"id":"approval-policy","text":"Claude Approvals 应用仓库策略文件，允许按规则批准常规改动或要求人工签核。","evidence":["ship"]},{"id":"observe-mode","text":"官方建议先观察审批结果，再配置分支保护要求该检查。","evidence":["ship"]}],"limitations":["AI 审查可能遗漏缺陷；Ship 目前不适用于 ZDR、HIPAA 配置或客户管理加密密钥的组织。"]},{"id":"live-shields","layout":"system-map","title":"Shirudo：临时缓解与永久修复分离","conclusion":"防护生成、合法负载测试、签名审批和实际加载应形成独立关卡。","facts":[{"id":"ebpf-runtime","text":"OpenAI 与 Cisco 于 11 月 23 日公布 Shirudo，通过 eBPF 对运行中的 Linux 系统施加针对性防护。","evidence":["shirudo"]},{"id":"controlled-test","text":"官方受控测试中，Codex 生成的防护阻止了一次针对运行中 Elasticsearch 的漏洞利用尝试，无需重启。","evidence":["shirudo"]},{"id":"trusted-load","text":"项目设计包含签名校验、内核验证器和 TPM 支持的防护状态记录。","evidence":["shirudo"]}],"limitations":["受控测试不代表所有漏洞均可在线缓解，仍需正式补丁及业务回归测试。"]},{"id":"file-slicing","layout":"architecture","title":"Gemini 文件切片：上下文成为可请求资源","conclusion":"先定位片段再细读，让 Agent 以任务需求决定上下文预算。","facts":[{"id":"native-slices","text":"Google 于 11 月 23 日宣布 Gemini API 支持服务端文件切片，包括文档页、表格单元格和媒体时段。","evidence":["slicing"]},{"id":"uri-reuse","text":"Files API URI 可跨轮次复用，也可以在函数响应中指定处理范围。","evidence":["slicing"]},{"id":"metered-input","text":"官方称仅对实际处理部分计入 token；Gemini 4 支持该能力，原有文件大小和页数限制仍适用。","evidence":["slicing"]}],"limitations":["切片是处理范围而非上传范围，敏感文件仍需先做数据准入判断。"]},{"id":"enterprise-monitoring","layout":"system-map","title":"EFS：保留策略与安全监测解耦","conclusion":"把日志控制权、风险检测与安全事件处置设计为不同职责。","facts":[{"id":"public-beta","text":"Anthropic 于 11 月 23 日开放 Enterprise Frontier Safeguards 公测，目标是兼容 ZDR 的自动安全监测。","evidence":["efs"]},{"id":"multi-request","text":"EFS 在客户控制的基础设施数据上分析多次请求中的滥用模式，而非只检查单次请求。","evidence":["efs"]},{"id":"safety-case","text":"检测到风险后形成 Safety Case，可经云存储或 API 读取并接入 SIEM；该记录不含输入输出。","evidence":["efs"]}],"limitations":["公测能力不等于所有产品均满足 ZDR；需按产品、合同和地区核验。"]},{"id":"formal-search","layout":"metrics","title":"Lean：搜索可以并行，验收必须独立","conclusion":"多 Agent 探索的结果先通过可执行证明，再进入共享知识。","facts":[{"id":"independent-teams","text":"DeepMind 在 11 月 23 日披露使用独立 Gemini 4 Agent 团队探索量子算法改进，并用 Lean 验证结果后写入共享笔记。","evidence":["quantum"]},{"id":"resource-metric","text":"作者报告聚变相关电路的综合计算成本降低 11.8 倍，纠错逻辑量子比特需求从 5650 降至 4338。","evidence":["quantum"]},{"id":"released-artifacts","text":"团队公开 Lean 库、问题规格与已验证解答。","evidence":["quantum"]}],"limitations":["报告的资源估算并非在真实量子硬件上的运行速度；证明只覆盖已形式化的规格。"]}],"projects":[{"action":"READ","name":"Shirudo","summary":"阅读运行时防护与可信加载设计，在隔离环境评估。","maturity":"early","url":"https://github.com/shirudo-dev/shirudo"},{"action":"READ","name":"Formal Quantum Computation","summary":"研究问题规格、证明和候选搜索之间的接口。","maturity":"experimental","url":"https://github.com/google-deepmind/formal-quantum-computation"}],"radar":[{"label":"PR 角色分离","impact":92,"horizon":15,"note":"优先验证观察模式与分支保护。"},{"label":"文件切片","impact":82,"horizon":25,"note":"可从非敏感长文档评估成本与召回。"},{"label":"运行时防护与形式化验证","impact":85,"horizon":65,"note":"先在隔离环境验证，再逐步扩展适用范围。"}],"actions":[{"title":"设计 PR 审批矩阵","description":"选取低风险仓库，分别记录修复、审批、CI 和人工复核结果，先观察再授权。"},{"title":"评估在线防护","description":"在隔离 Linux 虚拟机中测试签名、加载、撤销及正常流量回归，不替代正式补丁。"},{"title":"验证切片与数据边界","description":"用合成文档比较全量与切片的 token、召回及耗时，检查上传和日志权限。"},{"title":"引入独立验证","description":"为一个确定性业务规则编写独立断言或形式化规格，只接受通过验证的候选。"}],"references":[{"id":"shirudo","title":"OpenAI and Cisco introduce Shirudo","url":"https://openai.com/index/introducing-shirudo/","supports":"支持 eBPF 防护、签名验证、TPM 记录和受控实验。","accessedAt":"2026-11-25"},{"id":"ship","title":"Introducing Claude Ship","url":"https://claude.com/resources/articles/introducing-claude-ship","supports":"支持三个角色、审批策略、观察模式与可用性限制。","accessedAt":"2026-11-25"},{"id":"ship-docs","title":"Claude Ship documentation","url":"https://code.claude.com/docs/en/claude-ship","supports":"支持 PR 角色分离及 GitHub 分支规则约束。","accessedAt":"2026-11-25"},{"id":"slicing","title":"Introducing file slicing controls in the Gemini API","url":"https://blog.google/innovation-and-ai/technology/developers-tools/file-slicing-controls/","supports":"支持文件切片、URI 复用与处理范围计费。","accessedAt":"2026-11-25"},{"id":"efs","title":"Zero data retention with Enterprise Frontier Safeguards is now in beta","url":"https://claude.com/resources/articles/zero-data-retention-with-enterprise-frontier-safeguards","supports":"支持客户控制存储、跨请求监测及 Safety Case。","accessedAt":"2026-11-25"},{"id":"quantum","title":"Finding faster quantum algorithms with agents and formal verification","url":"https://deepmind.google/blog/finding-faster-quantum-algorithms-with-agents-and-formal-verification/","supports":"支持独立 Agent 团队、Lean 证明及作者报告的资源估算。","accessedAt":"2026-11-25"}],"archivePicks":[{"title":"Orbis · 2026-11-24 — Agent 工程的双重门禁","url":"https://github.com/XiaoDaoJiang/Orbis/blob/main/content/briefs/2026-11-24.yaml","supports":"对照能力与数据边界的独立核验。","publishedAt":"2026-11-24"}],"corrections":[],"presentation":{"enabled":true,"template":"daily-v1"}}