actions:
  - title: 审计 MCP Session 假设
    description: 列出当前 Client、Server、Gateway 对 initialize、Session ID、黏性路由和长任务状态的依赖，并制定无状态迁移测试。
  - title: 给高权限 Agent 增加可中断边界
    description: 将网络、文件、Shell 和凭证访问纳入最小权限策略，并为高风险动作增加轨迹监控、自动停止和人工恢复入口。
  - title: 建立 Agent 资源目录原型
    description: 用最小 Registry 记录 Agent、MCP Server、Skill、版本、Owner、审批状态和可用环境，验证发现与授权是否能从 Prompt 中移出。
  - title: 测试持久审批的作用域
    description: 对 Allow Always 类能力验证身份、Session、Server、Tool 参数范围、撤销和审计日志，避免便利性扩大权限面。
