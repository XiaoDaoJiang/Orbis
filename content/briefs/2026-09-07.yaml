kind: brief
cadence: daily
evidenceVersion: 1
publishedAt: 2026-09-07
status: published
title: Agent 的新边界正在变成显式策略层
summary: 工作区信任、工具访问、网络出口、凭据与外部生命周期监督正从隐式约定变成可验证策略；生产级 Agent 的竞争焦点正在从“会调用工具”转向“每个副作用都有边界、所有权和证据”。
topics:
  - agent-harness
  - coding-agent
  - mcp
signals:
  - title: Workspace 本身就是安全边界
    summary: Gemini CLI 的最新安全修复把环境变量变更、路径边界与系统级配置权限都纳入显式信任检查。
    impact: high
  - title: Tool Access 正在收敛到策略网关
    summary: GitHub 的 Agentic Workflows 与 MCP Gateway 把只读默认、完整性过滤、调用次数和写入通道拆成独立控制面。
    impact: high
  - title: Egress 与凭据必须和 Agent 进程隔离
    summary: Agentic Workflow Firewall 用网络 allowlist、API proxy sidecar、DLP 与运行时限制把外部副作用变成可审计资源。
    impact: high
  - title: 生命周期权限正在移出 Agent 主进程
    summary: OpenClaw 更早已引入 external supervisor 模式，2026.9.2 继续强化升级、Gateway 重启与 reply recovery，说明 restart、自更新和会话恢复正成为独立控制面。
    impact: high
sections:
  - id: workspace-trust
    layout: timeline
    title: Gemini CLI 把 Workspace Trust 从提示语升级为执行约束
    conclusion: Coding Agent 的第一道安全边界正在前移到工作区、环境变量与系统级配置加载阶段。
    facts:
      - id: env-change-consent
        text: Gemini CLI v0.60.0 nightly 在 2026-09-05 增加环境变更同意提示，并清理可能改变运行时行为的环境变量。
        evidence:
          - gemini-cli-v0-60-nightly
      - id: workspace-path-boundaries
        text: 同一版本强化 workspace 路径边界检查和符号链接解析，并将其用于 command safety 与 file discovery。
        evidence:
          - gemini-cli-v0-60-nightly
      - id: system-config-permissions
        text: 同一版本对 system-wide configuration paths 执行更严格的权限与所有权检查。
        evidence:
          - gemini-cli-v0-60-nightly
    limitations:
      - 该版本属于 nightly 预发布，能力与默认行为仍可能继续调整。
      - 这些修复降低宿主环境风险，但不能替代工具级权限和网络隔离。
  - id: deterministic-boundary
    layout: architecture
    title: Reasoning 与 Deterministic Execution 正在被明确拆开
    conclusion: 生产自动化更适合让 Agent 负责判断，让构建、测试与受控写入继续由确定性工作流执行。
    facts:
      - id: deterministic-ci-actions
        text: GitHub Agentic Workflows 官方建议 build、test、lint、deploy 与 reproducible scripts 等确定性操作继续使用 conventional GitHub Actions。
        evidence:
          - github-agentic-workflows
      - id: read-only-agent-safe-outputs
        text: Agent jobs 默认使用只读 GitHub 权限并在 sandbox 中执行；配置的 GitHub 写操作通常由独立 safe-outputs jobs 校验后以 scoped permissions 执行。
        evidence:
          - github-agentic-workflows
      - id: compiled-lock-workflow
        text: gh aw compile 会验证 Agentic Workflow 源并生成由 GitHub Actions 执行的 .lock.yml workflow。
        evidence:
          - github-agentic-workflows
    limitations:
      - 该设计深度绑定 GitHub Actions 运行模型，迁移到其他执行平台需要重新实现等价的权限与输出门控。
      - 官方仍要求谨慎处理安全配置并保持人工监督，不能把安全默认值理解为零风险。
  - id: mcp-policy-plane
    layout: system-map
    title: MCP Gateway 正从连接器变成 Tool Policy Plane
    conclusion: MCP 的生产化价值不只在统一调用协议，更在把来源完整性、调用额度和写入方向放到 Agent 外部执行。
    facts:
      - id: allow-only-write-sink
        text: GitHub MCP Gateway 的 guard policies 将 source server 的 allow-only 与 output server 的 write-sink 分开，用不同策略约束可读来源和写入 sink。
        evidence:
          - github-mcp-gateway
      - id: allow-only-integrity-scope
        text: allow-only 可限制 public、owner/repo 范围与 minimum integrity，并支持 blocked-users、approval-labels 和 trusted-users。
        evidence:
          - github-mcp-gateway
      - id: tool-call-limits-tracing
        text: tool-call-limits 可在调用 backend 前按 session 硬限制单个工具的调用次数；Gateway 同时提供 tool timeout 与 OpenTelemetry tracing 配置。
        evidence:
          - github-mcp-gateway
    limitations:
      - 策略粒度越高，配置和运维复杂度越高，需要版本化策略、测试样例和审计日志配套。
      - Gateway 控制的是工具边界，无法单独解决 Agent 在已授权工具内部做出错误业务判断的问题。
  - id: egress-boundary
    layout: architecture
    title: 网络出口和模型凭据开始成为独立 Runtime 资源
    conclusion: 高权限 Agent 不应直接拥有开放网络与模型密钥，egress policy 和 credential proxy 应成为 Harness 的一等组件。
    facts:
      - id: squid-domain-allowlist
        text: Agentic Workflow Firewall 通过 Squid 对 outbound HTTP/HTTPS 实施 domain allowlist，并在容器化 agent 执行环境中集中控制网络出口。
        evidence:
          - github-agentic-workflow-firewall
      - id: api-proxy-credentials
        text: 可选 API proxy sidecar 负责持有认证凭据并安全注入 API keys，使 Agent 无需直接持有这些模型凭据。
        evidence:
          - github-agentic-workflow-firewall
      - id: dlp-timeout-audit
        text: Firewall 提供可选 DLP、agent timeout、网络流量统计与 audit/log 分析能力，用于约束和追踪运行时副作用。
        evidence:
          - github-agentic-workflow-firewall
    limitations:
      - HTTPS URL path 级过滤需要启用 SSL Bump；只配置 domain allowlist 时不会检查完整 URL path。
      - 不同 sandbox runtime 的网络隔离保证并不完全相同，生产采用前需要按实际执行路径验证 egress 边界。
  - id: external-supervision
    layout: system-map
    title: Runtime 生命周期权限正在形成独立 Supervisor Boundary
    conclusion: Agent 自身不应同时拥有任务推理、服务生命周期、更新权限和凭据控制；这些高风险能力正被拆到可验证的外部监督层。
    facts:
      - id: external-supervisor-mode
        text: OpenClaw v2026.7.2-beta.2 已加入 OPENCLAW_SUPERVISOR_MODE=external，使外部 lifecycle owner 可接管 restart 与 deferral，同时阻止 native service mutation 和 self-update，并提供 versioned atomic restart-handoff consume contract。
        evidence:
          - openclaw-v2026-7-2-beta-2
      - id: restart-session-cron-recovery
        text: 同一 beta 版本还修复 Gateway restart admission 卡死、reply session finalization stall 后的恢复，以及 one-shot cron lifecycle claim race。
        evidence:
          - openclaw-v2026-7-2-beta-2
      - id: reliable-upgrades-recovery
        text: OpenClaw v2026.9.2 的可靠升级与恢复能力会在自动更新中保留 active settings、enabled skills 和 default-agent ownership，并恢复 Git update 后的 Gateway restart。
        evidence:
          - openclaw-v2026-9-2
      - id: replies-survive-restarts
        text: v2026.9.2 还会在 Gateway restart 后恢复 active、queued 和 delegated replies，并支持更多 settings 由其 running owners 在线应用而无需重启。
        evidence:
          - openclaw-v2026-9-2
    limitations:
      - 这是 OpenClaw 的具体实现，不代表行业已经形成统一 Supervisor 协议。
      - 将生命周期权限外移只是缩小 Agent 权限面，外部 supervisor 本身仍需要身份、审计和失败恢复机制。
projects:
  - action: TEST
    name: github/gh-aw
    summary: 验证 read-only agent、safe outputs 与 deterministic CI 的职责拆分。
    maturity: early
    url: https://github.com/github/gh-aw
  - action: TEST
    name: github/gh-aw-mcpg
    summary: 用一个真实 MCP server 验证 integrity、tool-call limit 和 write-sink 策略。
    maturity: early
    url: https://github.com/github/gh-aw-mcpg
  - action: TEST
    name: github/gh-aw-firewall
    summary: 验证 egress allowlist、API proxy sidecar 和 audit log 对 Coding Agent 的约束。
    maturity: early
    url: https://github.com/github/gh-aw-firewall
  - action: WATCH
    name: google-gemini/gemini-cli
    summary: 跟踪 workspace trust、extension loading 与 MCP OAuth 安全修复何时进入稳定版本。
    maturity: growing
    url: https://github.com/google-gemini/gemini-cli
  - action: TEST
    name: openclaw/openclaw
    summary: 验证 external supervisor、restart handoff 与后续 upgrade/recovery 行为是否能隔离生命周期权限。
    maturity: growing
    url: https://github.com/openclaw/openclaw
radar:
  - label: Workspace trust enforcement
    impact: 91
    horizon: 12
    note: 本地 Coding Agent 已直接接触 shell 和文件系统，应立即建立。
  - label: MCP policy gateway
    impact: 94
    horizon: 18
    note: 多工具系统越复杂，集中权限和调用额度越有价值。
  - label: Egress and credential isolation
    impact: 96
    horizon: 15
    note: 对高权限 Agent 属于上线前基础安全控制。
  - label: External supervisor boundary
    impact: 93
    horizon: 20
    note: restart、自更新与凭据控制应与 Agent 推理进程分离，并建立显式 handoff。
  - label: Safe output channels
    impact: 92
    horizon: 20
    note: 把写入从 Agent 主进程移出，可显著缩小不可逆副作用面。
actions:
  - title: 给 Coding Agent 增加 Workspace Trust 检查
    description: 在执行 shell 或加载项目配置前校验工作区根目录、符号链接、配置文件所有权与运行时环境变量来源。
  - title: 把 MCP 权限移出 Prompt
    description: 用 Gateway 或 wrapper 明确限制可访问 repo、工具调用次数、超时和允许的写入 sink，不依赖模型自我约束。
  - title: 隔离网络出口与模型密钥
    description: 为高权限 Agent 增加 egress allowlist，并通过独立 credential proxy 注入模型调用能力而不是直接暴露 API key。
  - title: 定义外部 Supervisor 交接协议
    description: 将 restart、自更新、凭据和高风险配置变更移出 Agent 进程，并用版本化 handoff、审批绑定和审计记录约束生命周期操作。
