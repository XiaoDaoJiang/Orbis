publishedAt: 2026-09-07
status: published
title: Agent 的新边界正在变成显式策略层
summary: 工作区信任、工具访问、网络出口、凭据与 tracing 正从隐式约定变成可验证策略；生产级 Agent 的竞争焦点正在从“会调用工具”转向“每个副作用都有边界和证据”。
topics:
  - agent-harness
  - coding-agent
  - mcp
signals:
  - title: Workspace 本身就是安全边界
    summary: Gemini CLI 的最新安全修复把环境变量变更、路径穿越与系统级配置权限都纳入显式信任检查。
    impact: high
  - title: Tool Access 正在收敛到策略网关
    summary: GitHub 的 Agentic Workflows 与 MCP Gateway 把只读默认、完整性过滤、调用次数和写入通道拆成独立控制面。
    impact: high
  - title: Egress 与凭据必须和 Agent 进程隔离
    summary: Agentic Workflow Firewall 用网络 allowlist、API proxy sidecar、DLP 与运行时限把外部副作用变成可审计资源。
    impact: high
  - title: Observability 开始需要数据最小化
    summary: LangGraphJS 新增 per-node tracePolicy 与 omitPayload，说明 tracing 不能再默认等于记录全部输入输出。
    impact: medium
sections:
  - id: workspace-trust
    layout: timeline
    title: Gemini CLI 把 Workspace Trust 从提示语升级为执行约束
    conclusion: Coding Agent 的第一道安全边界正在前移到工作区、环境变量与系统级配置加载阶段。
    facts:
      - Gemini CLI v0.60.0 nightly 在 2026-09-05 增加环境变更同意提示，并清理可能改变运行时行为的环境变量。
      - 同一版本强化 workspace 路径边界和符号链接解析，减少命令安全检查与文件发现被路径绕过的风险。
      - 系统级配置路径开始执行更严格的权限与所有权检查。
    limitations:
      - 该版本属于 nightly 预发布，能力与默认行为仍可能继续调整。
      - 这些修复降低宿主环境风险，但不能替代工具级权限和网络隔离。
    references:
      - title: Gemini CLI v0.60.0 nightly 20260905
        url: https://github.com/google-gemini/gemini-cli/releases/tag/v0.60.0-nightly.20260905.g85aca163f
        source: github
        supports: 环境变量、workspace 路径边界和系统配置权限的安全修复。
        accessedAt: 2026-09-07
  - id: deterministic-boundary
    layout: architecture
    title: Reasoning 与 Deterministic Execution 正在被明确拆开
    conclusion: 生产自动化更适合让 Agent 负责判断，让构建、测试与受控写入继续由确定性工作流执行。
    facts:
      - GitHub Agentic Workflows 明确建议构建、测试、lint 和部署继续使用 conventional GitHub Actions。
      - Agent job 默认采用只读 GitHub 权限和 sandbox，写操作通过经过验证的 safe-outputs job 以受限权限执行。
      - Agentic Workflow 的 Markdown 源会先编译和验证，再生成标准 GitHub Actions workflow。
    limitations:
      - 该设计深度绑定 GitHub Actions 运行模型，迁移到其他执行平台需要重新实现等价的权限与输出门控。
      - 仓库明确提示 Agentic Workflows 仍需要人工监督，不能把安全默认值理解为零风险。
    references:
      - title: GitHub Agentic Workflows
        url: https://github.com/github/gh-aw
        source: github
        supports: 只读默认、sandbox、safe outputs 与 deterministic workflow 的职责边界。
        accessedAt: 2026-09-07
  - id: mcp-policy-plane
    layout: system-map
    title: MCP Gateway 正从连接器变成 Tool Policy Plane
    conclusion: MCP 的生产化价值不只在统一调用协议，更在把来源完整性、调用额度和写入方向放到 Agent 外部执行。
    facts:
      - GitHub MCP Gateway 支持 allow-only 与 write-sink guard policy，把可读来源与可写目标拆成不同策略。
      - allow-only 可按 public、owner、repo 和 integrity level 限制输入来源，并支持 blocked users、trusted users 与 approval labels。
      - tool-call-limits 可以在调用后端前按 session 硬限制单个工具的调用次数，同时 gateway 支持超时和 OpenTelemetry tracing。
    limitations:
      - 策略粒度越高，配置和运维复杂度越高，需要版本化策略、测试样例和审计日志配套。
      - Gateway 控制的是工具边界，无法单独解决 Agent 在已授权工具内部做出错误业务判断的问题。
    references:
      - title: GitHub Agentic Workflows MCP Gateway
        url: https://github.com/github/gh-aw-mcpg
        source: github
        supports: MCP guard policies、integrity filtering、tool-call limits 与 tracing。
        accessedAt: 2026-09-07
  - id: egress-boundary
    layout: architecture
    title: 网络出口和模型凭据开始成为独立 Runtime 资源
    conclusion: 高权限 Agent 不应直接拥有开放网络与模型密钥，egress policy 和 credential proxy 应成为 Harness 的一等组件。
    facts:
      - Agentic Workflow Firewall 通过 Squid proxy 对 outbound HTTP/HTTPS 做 domain allowlist，并把 Agent 放在独立 Docker sandbox 中。
      - 可选 API proxy sidecar 持有模型 API key，使密钥不进入 Agent 进程。
      - Firewall 还提供 DLP、agent timeout、流量统计和 audit log，形成运行时副作用证据。
    limitations:
      - 当前快速路径依赖 Docker，官方兼容性主要面向 Ubuntu/Linux 环境。
      - URL 级过滤需要 SSL Bump；更强的 microVM backend 仍属于 preview 能力。
    references:
      - title: GitHub Agentic Workflow Firewall
        url: https://github.com/github/gh-aw-firewall
        source: github
        supports: 网络 allowlist、凭据隔离、DLP、运行时限制和审计能力。
        accessedAt: 2026-09-07
  - id: trace-minimization
    layout: comparison
    title: Trace 可见性与数据最小化必须同时设计
    conclusion: Agent observability 正从“尽量记录”转向“保留 span 与 timing，同时按节点裁剪敏感 payload”。
    facts:
      - LangGraphJS 1.4.15-rc.0 新增 per-node tracePolicy，可分别处理节点 trace 的 input 和 output。
      - omitPayload 可以保留节点 span 与 timing 而不记录 payload，适合敏感上下文或大对象场景。
      - 处理器只影响节点自己的 trace payload，不自动改变 graph state、root run 或 child run。
    limitations:
      - 当前实现中 trace processor 抛错时会回退到原始 payload；如果目标是严格脱敏，需要额外的 fail-closed 保护。
      - 该能力目前发布在 release candidate，正式版行为仍需继续验证。
    references:
      - title: LangGraphJS 1.4.15-rc.0
        url: https://github.com/langchain-ai/langgraphjs/releases/tag/%40langchain%2Flanggraph%401.4.15-rc.0
        source: github
        supports: per-node tracePolicy、omitPayload 与处理器失败时的回退语义。
        accessedAt: 2026-09-07
