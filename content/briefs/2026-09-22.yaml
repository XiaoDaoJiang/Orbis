radar:
  - label: Declarative agent control planes
    impact: 97
    horizon: 8
    note: Task、Workspace、Gateway 与 Model 等资源对象让 Agent 运行边界从脚本约定转成可版本化基础设施。
  - label: Long-horizon execution loops
    impact: 95
    horizon: 10
    note: 数小时持续执行、反馈和回滚正在成为衡量 Agent 能力的重要维度，但成本与失败恢复必须同时测量。
  - label: Specialist multimodal tools
    impact: 86
    horizon: 12
    note: 更紧凑的生成/编辑模型更容易被 Planner 当成工具组合，降低所有视觉任务都走通用大模型的必要性。
  - label: Robust document ingestion
    impact: 92
    horizon: 6
    note: 真实文档中的退化、表格和阅读顺序错误会直接污染 Agent 后续证据链，输入可靠性应优先验证。
  - label: Model × Runtime compatibility
    impact: 94
    horizon: 8
    note: 模型、Runner、网络策略、工具协议与专业组件的兼容矩阵正在成为生产 Agent 的主要维护对象。
actions:
  - title: 为本地 Agent Runtime 画出声明式资源边界
    description: 参考 AX 的 Task、Workspace、Gateway、Model 拆分，审视现有 Agent 项目中哪些状态仍藏在启动脚本、环境变量或 Prompt 中，并确定可版本化的最小资源合同。
  - title: 给长任务测试同时记录进展、回退和资源成本
    description: 不要只看最终 pass/fail；至少记录最佳状态 checkpoint、失败尝试、工具调用、token/GPU 时间和恢复点，验证长时间 Agent 是否真正形成有效反馈闭环。
  - title: 把视觉生成与文档解析当成独立可替换工具
    description: 分别用 Qwen-Image-2.1 与 WeVisDoc 构建小型适配层，让 Planner 只消费稳定输入输出合同，并对模型升级做单独回归。
  - title: 建立组件级 evidence 与版本追踪
    description: 对 Runtime、模型、parser 和工具保存明确版本及测试证据，避免某一层升级后只能通过最终 Agent 失败来反推原因。
