{"kind":"brief","cadence":"daily","evidenceVersion":1,"publishedAt":"2026-11-28","status":"published","title":"Agent 工程的效率边界：推理缓存、任务生命周期与权限治理","summary":"本期从 DFly2 的长上下文推理优化、OpenCode 的任务与权限改进、Claude Code 的技能执行及可观测性、Ming 的设计资产和 Copilot 审查计费，观察如何把效率提升转化为可测量、可治理的工程收益。","topics":["agent-harness","coding-agent","mcp"],"tags":["Speculative Decoding","Agent Observability","AI Infra","Visual Design","Cost Governance"],"signals":[{"title":"长上下文加速需要分离吞吐与延迟","summary":"DFly2 共享目标模型的稀疏缓存与索引，值得在真实长任务上复测接受率与并发吞吐。","impact":"high"},{"title":"任务失败与调度终止不是同一状态","summary":"OpenCode 细化失败后继续调度、命令超时和站点级授权，值得纳入 Harness 生命周期测试。","impact":"high"},{"title":"技能与会话需要独立观测和授权","summary":"Claude Code 扩展技能加载 Hook 和响应事件，为技能执行前控制与会话复盘提供新切入点。","impact":"high"},{"title":"设计交付与审查成本都需要明确验收口径","summary":"Ming 将设计生成连接到下游编辑，Copilot 则调整审查默认计费归属；需分别验证产物质量与费用责任。","impact":"medium"}],"sections":[{"id":"dfly2","layout":"architecture","title":"DFly2：让草稿模型复用目标模型稀疏状态","conclusion":"长上下文推理的优化对象不仅是模型大小，还包括缓存、位置选择和并发资源。","facts":[{"id":"release","text":"腾讯 AngelSpec 于 11 月 26 日宣布开放 DFly2 的权重、训练代码和技术报告，并扩展至三类 Flash 目标模型。","evidence":["angelspec"]},{"id":"sharing","text":"DFly2 复用目标层 KV 缓存及索引器选择的位置，草稿层不维护独立缓存，也不额外执行位置打分。","evidence":["dfly2-paper"]},{"id":"throughput","text":"作者报告 DS-V4.1-Flash 在高并发、匹配单用户解码速度的条件下，两组 64K 数据集吞吐分别提升 62% 和 81%。","evidence":["dfly2-paper"]}],"limitations":["结果来自作者实验；不能直接外推到其他模型、硬件或端到端 Agent 成功率。"]},{"id":"opencode-runtime","layout":"system-map","title":"OpenCode：将调度、超时和授权分开","conclusion":"持续任务的失败应有记录，但不必自动废弃整个调度；工具授权也需要明确范围。","facts":[{"id":"schedule","text":"OpenCode v2.4.2 在 11 月 26 日发布：单次自动化失败会记录，后续运行仍按计划执行；会话或目录消失等情况仍会暂停。","evidence":["opencode-release"]},{"id":"timeout","text":"自动化内的 Shell 命令超时后被停止并导致调用失败，不再转入后台。","evidence":["opencode-release"]},{"id":"scope","text":"Web Fetch 的新永久授权仅允许对应站点；旧版本已保存的授权保持原状。","evidence":["opencode-release"]},{"id":"session","text":"向归档会话发送消息、命令、技能或 Shell 命令会解除归档；移动会话也会移动其子 Agent。","evidence":["opencode-release"]}],"limitations":["需单独检查旧授权；归档不等于不可变的审计记录。"]},{"id":"claude-observability","layout":"architecture","title":"Claude Code：技能加载与跨会话消息的可观测性","conclusion":"在技能执行前设置检查点，并为跨会话输出保留受控观测数据，才能更好地复盘 Agent 行为。","facts":[{"id":"skill-hook","text":"Claude Code v2.1.332 于 11 月 25 日发布，新增 MCP 服务端技能测试功能及 PreSkillShellCommand Hook，可拒绝加载时的内联 Shell 命令。","evidence":["claude-release"]},{"id":"response-event","text":"启用响应日志时，SendUserMessage 或 Cowork 消息工具发送的文本可产生 OpenTelemetry assistant_response 事件。","evidence":["claude-release"]},{"id":"resume-warning","text":"该版本还增加了部分会话未保存、恢复时早期消息未加载的界面提示。","evidence":["claude-release"]}],"limitations":["该事件不代表所有工具调用或全量会话 Trace；采集响应文本需要明确脱敏和保留策略。"]},{"id":"ming-design","layout":"comparison","title":"Ming：从设计效果到可编辑资产","conclusion":"对设计 Agent 的验收应区分图像观感、文本正确性、编辑能力和实际页面行为。","facts":[{"id":"checkpoint","text":"Ming-Image-0.2-Design 模型卡列出 6B DiT、MIT 许可证及面向视觉设计的生成任务。","evidence":["ming-card"]},{"id":"layers","text":"模型卡称新版本改进构图、光照及文字渲染，并介绍更细粒度的图层分解方向；表格仍将生成与上一代 Layer 模型分列。","evidence":["ming-card"]},{"id":"deployment","text":"模型卡提供自然语言与结构化设计提示示例，验证配置为单张 80 GiB 显存 CUDA GPU。","evidence":["ming-card"]}],"limitations":["不能从模型卡推断 0.2 图层权重已独立可用；生成图像也不等于通过交互与无障碍测试。"]},{"id":"review-cost","layout":"timeline","title":"Copilot：自动审查需要明确成本归属","conclusion":"规模化启用代码审查前，应把账单责任、授权范围及实际交付效果纳入同一治理清单。","facts":[{"id":"default-change","text":"GitHub 11 月 25 日公告：从 12 月 30 日起，符合条件且未设置计费方式的 Copilot Business 或 Enterprise 组织，持证成员的代码审查默认由仓库所属组织付费。","evidence":["copilot-billing"]},{"id":"explicit-choice","text":"已经明确选择 Member 或 Organization 的设置不变；未持证成员的独立设置也不变。","evidence":["copilot-billing"]},{"id":"exceptions","text":"组织计费需要启用付费 AI Credits；没有付费资格、计费锁定或没有可计费客户的账户会改设为 Member。","evidence":["copilot-billing"]}],"limitations":["公告描述默认策略变化，不代表所有组织必然增加相同金额。"]}],"projects":[{"action":"TEST","name":"Tencent/AngelSpec","summary":"在固定目标模型和上下文长度下对照测试草稿接受率与吞吐。","maturity":"early","url":"https://github.com/Tencent/AngelSpec"},{"action":"READ","name":"OpenCode v2.4.2","summary":"阅读调度失败、会话移动及授权范围的迁移说明。","maturity":"growing","url":"https://github.com/anomalyco/opencode/releases/tag/v2.4.2"},{"action":"TEST","name":"Ming-Image","summary":"验证生成文字与结构化设计提示，并独立检查图层资产。","maturity":"early","url":"https://github.com/inclusionAI/Ming-Image"}],"radar":[{"label":"长上下文推理复测","impact":85,"horizon":45,"note":"先验证接受率、吞吐及尾延迟，再决定是否部署。"},{"label":"Agent 生命周期与权限","impact":92,"horizon":15,"note":"优先补齐失败、超时、归档恢复与旧授权回归。"},{"label":"观测与成本治理","impact":88,"horizon":25,"note":"为响应日志和代码审查设置独立的保留及费用规则。"}],"actions":[{"title":"建立推理对照实验","description":"固定模型、硬件与任务集，记录不同上下文长度下的接受率、吞吐和 P95 延迟。"},{"title":"补齐调度和权限回归","description":"构造超时、单次失败、归档恢复及跨站点请求，用状态断言检验行为。"},{"title":"建立受控会话复盘","description":"关联会话、子 Agent、工具及消息事件，先用合成数据验证脱敏和保留策略。"},{"title":"验收设计与审查交付","description":"分开检查图像文本、可编辑资产和页面行为，同时确认组织审查的计费设置。"}],"references":[{"id":"angelspec","title":"AngelSpec repository and release notes","url":"https://github.com/Tencent/AngelSpec","supports":"DFly2 开源发布与支持的目标模型。","accessedAt":"2026-11-28"},{"id":"dfly2-paper","title":"DFly2: Turbocharging Long-Context Speculative Decoding by Sharing the Target's Sparsity","url":"https://arxiv.org/abs/2611.34776","supports":"缓存与索引共享、作者吞吐实验。","accessedAt":"2026-11-28"},{"id":"opencode-release","title":"OpenCode v2.4.2 release","url":"https://github.com/anomalyco/opencode/releases/tag/v2.4.2","supports":"调度、超时、权限与会话行为。","accessedAt":"2026-11-28"},{"id":"claude-release","title":"Claude Code v2.1.332 release","url":"https://github.com/anthropics/claude-code/releases/tag/v2.1.332","supports":"技能 Hook、响应事件与会话保存提示。","accessedAt":"2026-11-28"},{"id":"ming-card","title":"Ming-Image-0.2-Design model card","url":"https://huggingface.co/inclusionAI/Ming-Image-0.2-Design","supports":"生成模型规格、图层能力描述与部署配置。","accessedAt":"2026-11-28"},{"id":"copilot-billing","title":"Copilot code review billing will default to the organization","url":"https://github.blog/changelog/2026-11-25-copilot-code-review-billing-will-default-to-the-organization/","supports":"默认计费变化、适用条件及例外。","accessedAt":"2026-11-28"}],"archivePicks":[{"title":"Orbis · 2026-11-27 — Agent 工程走向可验证迁移、可交付产物与受控推理","url":"https://github.com/XiaoDaoJiang/Orbis/blob/main/content/briefs/2026-11-27.yaml","supports":"延伸阅读独立验收、端到端测试及受控推理。","publishedAt":"2026-11-27"}],"corrections":[],"presentation":{"enabled":true,"template":"daily-v1"}}
