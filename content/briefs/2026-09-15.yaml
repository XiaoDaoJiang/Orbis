kind: brief
cadence: daily
evidenceVersion: 1
publishedAt: 2026-09-15
status: published
title: 科学模型开始原生携带 Agent Runtime，Intern-S2 把长程任务与专用模态合进开放栈
summary: Intern-S2-397B 正式版把科学文献原页预训练、跨二十多个领域的强化学习、沙箱中的长程 Agent 训练、工具调用与时间序列等专用模态放进同一开放模型栈；更值得关注的是，部分能力已经明确依赖具体 Runtime 与协议桥接，说明开放模型竞争正在从单独权重扩展到 Model × Runtime × Agent Protocol 的联合工程。
topics:
  - agent-harness
signals:
  - title: 科学数据开始绕过“先解析成纯文本”的入口
    summary: Intern-S2-397B 的视觉预训练直接学习科学文献原始页面，把符号语义与视觉关系放进同一表示空间，科学模型的数据入口正从文本流水线扩展到页面级多模态。
    impact: high
  - title: 长程 Agent 能力正在成为模型训练目标
    summary: Intern-S2-397B 将多个 Agent framework 接入大规模沙箱环境进行长程强化学习，Agent 能力不再只是推理时 Harness 的外挂行为。
    impact: high
  - title: 专用模态正在暴露 Runtime 绑定
    summary: 官方模型卡允许多种推理框架部署核心模型，但当前时间序列推理只支持 LMDeploy，说明“模型支持某模态”与“任意 Runtime 都能承载它”已经不是同一件事。
    impact: high
  - title: 模型别名与退役计划必须进入运行时治理
    summary: InternLM 同时提供显式模型 ID、动态 latest 别名与 Preview 退役时间，并让响应暴露实际 ref_model；生产 Agent 需要把模型解析结果当成可观察部署状态。
    impact: high
sections:
  - id: raw-science-pretraining
    layout: architecture
    title: 科学预训练开始直接消费原始页面
    conclusion: 当模型能直接从论文页面学习公式、图表与文本之间的关系时，科学 Agent 的上游数据工程可以少依赖易丢失版面语义的中间解析层，但数据质量与视觉歧义仍需要单独验证。
    facts:
      - id: raw-page-visual-pretraining
        text: Intern-S2-397B 的官方说明称其视觉预训练直接从科学文献原始页面学习，不经过中间解析，并在共享表示空间中联合建模符号语义与视觉关系。
        evidence:
          - interns2-model-card
          - interns2-github
      - id: twenty-plus-science-domains
        text: Intern-S2-397B 将多样化科学强化学习任务扩展到二十多个领域并进行联合训练，官方列举的专用任务包括生物分子相互作用设计与材料结构生成。
        evidence:
          - interns2-model-card
          - interns2-github
    limitations:
      - 原始页面预训练减少中间解析并不意味着消除 OCR、版面歧义或科学符号误读风险。
      - 专业任务能力与效果主要来自官方说明，仍需要在具体科研工作流上独立复核。
  - id: sandbox-agent-training
    layout: system-map
    title: 长程 Agent 行为已经进入模型训练闭环
    conclusion: Agent 能力正在从“模型 + 外部脚手架”的推理时组合，前移到由交互环境和沙箱任务共同塑造的训练目标；因此评估模型时也需要同时观察其所处的 Harness 与环境约束。
    facts:
      - id: multi-framework-sandbox-rl
        text: Intern-S2-397B 通过把多个 Agent framework 连接到大规模沙箱环境，执行面向通用与科学长程任务的 black-box agentic reinforcement learning。
        evidence:
          - interns2-model-card
          - interns2-github
      - id: thinking-default-for-agentic-tasks
        text: Intern-S2-397B 模型卡说明 thinking mode 默认开启，并明确不建议在 agentic tasks 中关闭 thinking mode。
        evidence:
          - interns2-model-card
      - id: tool-call-support
        text: Intern-S2-397B 的官方使用说明提供 OpenAI 风格的 tools/tool_choice 调用示例，模型输出可以进入标准化工具调用循环。
        evidence:
          - interns2-model-card
    limitations:
      - 沙箱强化学习能够塑造长程行为，但并不能证明模型在未见过的真实工具和权限边界下同样可靠。
      - thinking mode 的官方建议属于模型提供方经验，仍需结合任务成本、延迟和失败模式做本地回归。
  - id: runtime-modality-coupling
    layout: comparison
    title: 模型能力与 Runtime 能力开始出现非对称
    conclusion: 开放权重并不自动意味着部署能力可互换；当时间序列等模态只在特定 Runtime 可用时，Runtime 兼容矩阵本身就必须成为模型选型和发布门禁的一部分。
    facts:
      - id: multiple-serving-runtimes
        text: Intern-S2-397B 官方模型卡给出 LMDeploy、vLLM 与 SGLang 三种部署路径，说明核心模型并不绑定单一推理框架。
        evidence:
          - interns2-model-card
      - id: time-series-lmdeploy-only
        text: 同一模型卡同时注明时间序列推理目前仅由 LMDeploy 支持，并提供地震波形与时间序列预测的专用输入示例。
        evidence:
          - interns2-model-card
      - id: inference-context-bounds
        text: 官方评测说明对文本推理使用最高 256K token 推理长度，对多模态 benchmark 使用最高 64K token 推理长度。
        evidence:
          - interns2-model-card
          - interns2-github
    limitations:
      - 官方支持列表会随 Runtime 更新而变化，部署前应以具体版本的兼容性测试为准。
      - benchmark 的最大推理长度不等同于每个生产场景都能以相同吞吐、显存和延迟稳定运行。
  - id: protocol-portability
    layout: architecture
    title: OpenAI 与 Anthropic 兼容协议正在成为 Harness 接口层
    conclusion: 当同一模型既能通过 OpenAI-compatible endpoint 接入普通 Agent framework，也能通过 Anthropic-compatible gateway 驱动 Claude Code 时，协议兼容层正在把模型、Harness 与客户端生命周期进一步解耦。
    facts:
      - id: self-hosted-openai-endpoint
        text: Intern-S2-397B 官方 Agent 集成说明支持通过自托管 LMDeploy 暴露 OpenAI-compatible endpoint，再由 Agent framework 以标准 client 接入。
        evidence:
          - interns2-model-card
      - id: claude-code-anthropic-endpoint
        text: 官方说明同时给出 LMDeploy 的 Anthropic-compatible /v1/messages 路径，用于把自托管 Intern-S2 接入 Claude Code。
        evidence:
          - interns2-model-card
      - id: official-api-dual-gateway
        text: InternLM 官方 API 路径同时提供 OpenAI-compatible 调用方式，以及面向 Claude Code 的 Anthropic-compatible gateway。
        evidence:
          - interns2-model-card
    limitations:
      - API 形状兼容不代表工具语义、错误类型、流式事件和上下文管理完全等价。
      - 在跨协议接入前仍应对 tool call、取消、重试、长上下文和多模态消息做端到端契约测试。
  - id: model-lifecycle-control
    layout: timeline
    title: 动态模型别名需要像依赖版本一样治理
    conclusion: 当 latest 别名可以重新指向新模型、Preview 模型存在明确退役日期时，Agent Runtime 应记录解析后的实际模型并允许显式 pin，而不是把字符串别名当成稳定能力合同。
    facts:
      - id: official-s2-model-id
        text: InternLM 官方模型文档将正式版 Intern-S2 暴露为模型 ID intern-s2，标注 397B 参数规模、256K context，并说明 thinking mode 默认开启。
        evidence:
          - internlm-models-api
      - id: latest-ref-model-resolution
        text: 官方文档建议使用 intern-latest 获取当前最新模型，并通过响应中的 ref_model 字段确认实际路由到的模型；示例响应显示 ref_model 为 intern-s2。
        evidence:
          - internlm-models-api
      - id: preview-retirement
        text: InternLM 官方文档标记 Intern-S2-Preview-397B 将在 2026-10-31 退役，并建议新集成使用显式版本 ID。
        evidence:
          - internlm-models-api
    limitations:
      - latest 别名适合快速跟进新模型，但会把行为漂移引入长期 Agent，因此生产任务更适合显式版本与受控升级。
      - 模型退役日期和别名指向属于服务运营状态，发布前需要重新查询而不是长期缓存。
projects:
  - action: READ
    name: InternLM/Intern-S1
    summary: 阅读 Intern-S2 正式版的模型说明、模型集合和评测入口，重点关注科学多模态与长程 Agent 的训练边界。
    maturity: growing
    url: https://github.com/InternLM/Intern-S1
  - action: TEST
    name: InternLM/lmdeploy
    summary: 用同一 Intern-S2 checkpoint 验证文本、工具调用、时间序列与 OpenAI/Anthropic 兼容接口，建立 Runtime 能力矩阵。
    maturity: stable
    url: https://github.com/InternLM/lmdeploy
radar:
  - label: Raw-page scientific pretraining
    impact: 87
    horizon: 22
    note: 页面级科学语义进入基础训练后，上游解析流水线与模型原生视觉能力需要重新划分职责。
  - label: Sandboxed long-horizon agent RL
    impact: 95
    horizon: 16
    note: Agent 行为进入训练闭环后，模型评测不能再脱离 Harness、环境和任务生命周期。
  - label: Runtime-bound modalities
    impact: 91
    horizon: 14
    note: 专用模态只在部分推理框架可用，会直接影响部署可移植性和回归测试范围。
  - label: Protocol compatibility layer
    impact: 86
    horizon: 12
    note: OpenAI 与 Anthropic 兼容入口降低客户端耦合，但协议兼容仍需要工具语义级测试。
  - label: Model lifecycle governance
    impact: 92
    horizon: 10
    note: 动态别名与模型退役会造成行为漂移，需要 pin、解析结果记录和升级门禁。
actions:
  - title: 为模型路由记录实际 ref_model
    description: 对所有使用 latest 或 provider alias 的 Agent 请求持久化显式请求模型与实际解析模型，升级时以差异触发回归验证。
  - title: 建立 Model × Runtime 能力矩阵
    description: 固定同一 checkpoint，分别验证 LMDeploy、vLLM 与 SGLang 的文本、图像、tool call、长上下文和专用模态支持，不把“模型支持”误写成“所有 Runtime 支持”。
  - title: 把 thinking mode 纳入 Agent 回归配置
    description: 将 thinking 开关、预算、延迟和成功率一起版本化，对长程任务先保持官方推荐默认值，再用受控实验决定是否调整。
  - title: 用沙箱长任务验证科学 Agent
    description: 设计需要多步工具调用、状态恢复和结果校验的科学任务，在隔离环境中记录失败位置、证据链和人工接管点。
