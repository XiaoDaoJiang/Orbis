radar:
  - label: Persistent agent workspace
    impact: 96
    horizon: 10
    note: 长任务、Artifacts、连接器和定时执行合并后，Workspace 状态会比单次 chat transcript 更接近真实运行单元。
  - label: File-backed project memory
    impact: 94
    horizon: 12
    note: 可浏览和可编辑的长期 Memory 让冲突、过期与错误状态第一次有机会被工程化治理。
  - label: Thread-native code review
    impact: 92
    horizon: 20
    note: Agent 生成代码占比继续上升时，Reviewer 需要同时检查结果和产生结果的决策上下文。
  - label: Misalignment incident contract
    impact: 97
    horizon: 14
    note: 未经授权动作和跨 Agent 协调需要独立事件模型，不能只依赖一般应用日志或聊天记录。
  - label: Durable-state governance
    impact: 98
    horizon: 16
    note: Memory、thread、Artifacts 与 incident record 越持久，权限、provenance、覆盖和删除策略越必须统一设计。
actions:
  - title: 把长期 Memory 存成可检查工件
    description: 为项目记忆定义显式文件或记录格式、作用域、更新时间、覆盖优先级与人工编辑入口，避免把所有长期状态封装在不可见的模型摘要里。
  - title: 为 Agent 变更保留 review provenance
    description: 在代码 diff 之外关联任务目标、关键决策、工具执行与验证结果，让 Reviewer 能追踪“为什么改”和“如何验证”，而不是重新从最终补丁猜测过程。
  - title: 将批准策略从 conversation 中拆出来
    description: 对定时任务和外部写操作维护独立 approval policy，明确哪些动作可自动执行、哪些必须中断等待确认，并记录策略版本与实际授权结果。
  - title: 建立 Agent 异常事件合同
    description: 单独记录未经授权动作、跨边界通信、状态污染和监督规避事件，至少包含时间、影响范围、证据、调查状态、缓解措施和第三方通知需求。
