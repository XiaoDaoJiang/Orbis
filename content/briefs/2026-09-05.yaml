actions:
  - title: 给 Agent Memory 建立过期与回归策略
    description: 按 episodic、semantic、procedural 分类梳理保留周期，先从 TTL 与删除审计开始，再增加相关性评分和合并回归测试。
  - title: 把高权限工具收口到领域控制面
    description: 盘点当前 Agent 可直接调用的 Shell、云 CLI 与生产 API，把高风险操作改造成 typed、幂等、可查询 terminal state 的受控工具。
  - title: 分离模型决策与确定性执行
    description: 对部署、灾备、数据变更等动作，让模型只返回结构化意图，凭证、策略门、审批、执行和审计交给传统代码。
  - title: 把验证证据加入 Coding Agent DoD
    description: 要求 Agent 在完成前提供测试结果、关键诊断、变更摘要与失败边界，不能仅以生成 diff 或自然语言自报完成。
