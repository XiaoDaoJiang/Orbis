radar:
  - label: Memory lifecycle policies
    impact: 92
    horizon: 12
    note: 长期运行 Agent 应立即建立 TTL、合并、删除与回归基线。
  - label: Deterministic action executor
    impact: 97
    horizon: 8
    note: 任何可修改生产状态的 Agent 都应优先采用模型外执行边界。
  - label: Model access control plane
    impact: 90
    horizon: 18
    note: 模型升级越来越快，身份、预算、监控和停止策略应与模型本身解耦。
  - label: MCP lifecycle compatibility
    impact: 81
    horizon: 25
    note: 生产 MCP 应增加严格客户端、版本混合和异常结束测试。
  - label: Human recovery path
    impact: 88
    horizon: 15
    note: 自动停止与策略门只有配套恢复和人工接管流程才真正可用。
actions:
  - title: 给 Agent Memory 建立过期与回归基线
    description: 按 episodic、semantic、procedural 分类定义 TTL、合并条件和删除策略，并在清理前后跑固定问题集验证质量变化。
  - title: 把高风险动作移到确定性执行器
    description: 让模型只输出经过 Schema 校验的意图和参数，真正的生产写操作由持证、可审计、受策略门控制的代码执行。
  - title: 将模型访问从 Agent Loop 中解耦
    description: 为高能力模型建立独立身份、预算、路由、监控和暂停策略，使模型切换不改变工具权限与执行边界。
  - title: 为 MCP 增加生命周期故障测试
    description: 覆盖混合协议版本、严格字段校验、取消、超时、重复启动和异常结束后的资源清理，避免只测试 happy path。
