radar:
- label: Persistent local agent runtime
  impact: 96
  horizon: 4
  note: 定时、后台运行、会话恢复与运行记录正在从附加功能变成桌面 Agent 的基础生命周期能力。
- label: Refusal-aware model routing
  impact: 92
  horizon: 5
  note: HTTP 成功码已不能代表任务成功，Runtime 需要把 refusal、fallback、实际 serving model 与计费尝试纳入统一观测。
- label: Provider-managed tool loops
  impact: 89
  horizon: 8
  note: 托管工具减少客户端 glue code，但 step budget、权限、数据流和供应商依赖必须显式治理。
- label: Concurrent conversational agents
  impact: 91
  horizon: 8
  note: 实时语音视觉交互要求前台 turn loop 与后台 tool loop 解耦，并把进展与失败重新投影到用户界面。
- label: Multi-agent evaluation environments
  impact: 94
  horizon: 12
  note: 共享市场和共享世界让代理间协调、竞争、偏好理解与系统级结果可以被更接近真实任务地测量。
actions:
- title: 给 Agent Task 建立可恢复生命周期
  description: 至少持久化 queued、running、waiting、failed、completed 与取消状态，并验证窗口关闭、进程重启和工具热更新时任务如何恢复。
- title: 把 refusal 独立于 transport error 监控
  description: 记录 stop_reason、refusal category、实际 serving model、fallback attempts 与每次成本，避免只看 HTTP 状态和最终文本。
- title: 为工具层增加统一 step 与 spend budget
  description: 无论工具在本地、MCP 还是服务端执行，都给每个 run 设置最大调用次数、耗时和费用，并记录预算耗尽原因。
- title: 拆分前台对话循环与后台执行循环
  description: 实时交互场景中让对话、任务进展和工具执行使用独立状态通道，明确 pending、partial、cancelled 与最终完成如何同步给用户。
- title: 用共享环境测试多 Agent 系统
  description: 设计一个带明确规则、可重放状态和结果指标的小型多人任务，分别测偏好理解、协商策略、冲突处理与整体效率，而不是只统计单 Agent 成功率。
