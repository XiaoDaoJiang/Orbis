actions:
  - title: 给每个 Skill 与 Plugin 建立行为回归套件
    description: 为关键扩展维护稳定任务集、grader、预期副作用和失败样本，并在宿主 Agent 或模型升级时自动重跑，而不是只验证能否加载。
  - title: 记录实际模型版本与 Harness provenance
    description: 在每次 Agent run 中记录模型别名、可解析的底层版本、Harness 版本、规则文件版本和关键配置，使同一任务结果能够跨升级比较。
  - title: 用 price per task 评估多模型协作
    description: 对 lead 与 sidekick 组合同时记录成功率、总成本、工具轮次、缓存命中和返工次数，再决定是否优于单模型或简单路由。
  - title: 把状态访问约束放到独立控制面
    description: 为长期 Agent 的状态与业务数据提供集中授权、审计、限流、熔断和有界查询接口，避免把资源保护只留给调用端自律。
