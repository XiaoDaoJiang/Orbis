kind: brief
cadence: daily
evidenceVersion: 1
publishedAt: 2026-09-12
status: published
title: Incremental adjacency validation Daily
summary: Synthetic published Daily used only to validate bounded route invalidation and complete artifact reuse.
topics:
  - agent-harness
signals:
  - title: Local invalidation
    summary: A new Daily should invalidate only its local adjacency boundary and aggregate discovery output.
    impact: high
  - title: Historical reuse
    summary: Older durable detail pages should restore when their rendered dependencies remain unchanged.
    impact: high
  - title: Scoped presentation build
    summary: Slidev should regenerate and build only the new Daily deck when the historical cache is complete.
    impact: medium
  - title: Complete artifact
    summary: The final assembled site must still contain and verify all historical routes and presentation artifacts.
    impact: watch
sections:
  - id: local-invalidation
    layout: architecture
    title: Local invalidation boundary
    conclusion: A newly published Daily should change only the new page, its prior Daily neighbor, and aggregate discovery surfaces.
    facts:
      - id: local-adjacency-fact
        text: The prior latest Daily gains a new next-navigation target when the synthetic Daily is published.
        evidence:
          - validation-source
    limitations:
      - This synthetic Daily exists only for CI validation and will never be merged.
  - id: historical-reuse
    layout: comparison
    title: Historical detail reuse
    conclusion: Detail pages outside the local adjacency boundary should remain reusable because future content is excluded from their related-content snapshot.
    facts:
      - id: historical-snapshot-fact
        text: Publication-time related-content snapshots exclude same-day and future candidates from historical detail dependencies.
        evidence:
          - validation-source
    limitations: []
  - id: scoped-slidev
    layout: timeline
    title: Scoped Slidev rebuild
    conclusion: A complete restored deck cache allows the presentation impact resolver to rebuild only the newly added Daily deck.
    facts:
      - id: scoped-slidev-fact
        text: The synthetic change set adds exactly one presentation-producing Brief while leaving shared Slidev code unchanged.
        evidence:
          - validation-source
    limitations: []
  - id: astro-cache
    layout: metrics
    title: Astro route cache
    conclusion: Astro should restore historical detail routes whose cache keys remain stable and render only routes whose actual output dependencies changed.
    facts:
      - id: astro-cache-fact
        text: Brief cache identity includes the current entry, directly referenced sources, historical related snapshot, and rendered Daily adjacency fields.
        evidence:
          - validation-source
    limitations: []
  - id: artifact-boundary
    layout: system-map
    title: Complete artifact remains authoritative
    conclusion: Incremental execution is only an acceleration layer; publication still depends on a complete assembled site passing every artifact contract.
    facts:
      - id: artifact-boundary-fact
        text: Final site verification checks all published Briefs, presentations, discovery routes, SEO, structured data, Registry UI, and lifecycle output.
        evidence:
          - validation-source
    limitations: []
projects: []
radar: []
actions:
  - title: Validate Astro reuse
    description: Verify historical detail pages restore while the local Daily neighbor rerenders.
  - title: Validate scoped Slidev
    description: Verify only the synthetic Daily presentation is generated and built after cache restore.
  - title: Validate complete artifact
    description: Verify the assembled site remains complete across all historical routes and contracts.
references:
  - id: validation-source
    title: Orbis incremental validation contract
    url: https://example.com/orbis-incremental-validation
    supports: Supports the synthetic assertions used only to exercise Orbis incremental build contracts.
archivePicks: []
presentation:
  enabled: true
  template: daily-v1
