actions:
  - title: 给高副作用 Tool 增加能力级评测
    description: 不只测试模型是否拒答，还为定位、控制、账户关联等真实动作链定义离线任务、成功阈值、人工审批和上线阻断条件。
  - title: 把企业 Agent 的语义和权限放到模型之外
    description: 优先复用现有 semantic layer、RBAC 与 source permissions，让模型只消费经过治理的定义和结果，不在 Prompt 中复制业务规则。
  - title: 将 MCP Tool 与 Skill Procedure 分开治理
    description: 为每个 MCP capability 定义可调用边界与权限，同时用独立 Skill 描述稳定 SOP，避免把访问能力和操作方法混成一个不可审计 Prompt。
  - title: 在 Agent 成本分析中加入 Kernel 与 Runtime 指标
    description: 除 token 与模型价格外，同时测量 TopK、KV、JIT 编译、缓存命中与设备切换成本，找到真正限制长任务吞吐的基础设施层。
