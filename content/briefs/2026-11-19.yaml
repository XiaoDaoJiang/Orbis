  "title": "Agent 生产化从更强模型走向分层运营：专业模型、弹性推理与授权治理",
  "summary": "OpenAI GPT-6.2 Astra 与 Sol 把复杂专业任务和日常工作分成不同的模型预算；Microsoft MAI Code 2 与 Cyber 2 Flash 则针对编码和安全任务提供专用选择。Perplexity Orchestrator 将模型路由与同模型跨部署故障转移整合到统一接口。Google Gemini Tasks 的隔离执行和关键动作确认，以及 Anthropic 缩短漏洞协调披露周期，提示团队将成本、权限、韧性和修复响应速度一起纳入 Agent 运行合同。",
