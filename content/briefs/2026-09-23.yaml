actions:
  - title: 给长任务记录完整反馈轨迹
    description: 除最终成功率外，保存工具调用、环境反馈、回滚点、grader 结果和耗时，让多小时任务可以解释“为什么改进或失败”。
  - title: 建立 Model × Harness 回归矩阵
    description: 对每个候选模型固定同一工具协议、权限、上下文预算和恢复策略，分别测裸模型与 Harness 适配后的收益和耦合成本。
  - title: 为最终工件增加质量 Judge
    description: 对 UI、文档、演示或视频等输出定义 3–5 个领域质量轴，并至少保留一部分人工成对偏好用于校准自动 evaluator。
  - title: 把高自主任务的专家审查前移
    description: 对研究、数学、安全或高风险专业任务，在任务设计阶段就定义外部专家、传播边界和证据要求，而不是只在最终输出时做一次审批。
