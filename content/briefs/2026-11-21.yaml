  "title": "Agent 规模化转向系统工程：按需工具、状态工作流、专用模型与人类验收",
  "summary": "Gemini API Tool Retrieval 把庞大的工具 schema 从常驻上下文移到按需加载，降低 Agent 工具规模化时的上下文负担。OpenAI Performance Factory 则用任务状态、事件唤醒与人工审核构成可恢复的性能修复闭环。Cloudflare 开放 Clairic 系列专用提取模型，为将结构化抽取从通用推理中拆分提供新选项；OpenAI 内部研究显示 Agent 在不同工作类型上的自主完成率差异显著。Antigravity SSH 进一步把运行环境拓展至远程 Linux 主机，权限与交付验证因此更需要被明确记录。",
