radar:
  - label: Bring-your-own-model agent shells
    impact: 92
    horizon: 12
    note: Harness 与模型账单解绑后，团队可以更主动地选择推理供应商与成本边界。
  - label: Role-aware model routing
    impact: 94
    horizon: 14
    note: 主 Agent、Oracle 与子 Agent 分层选模会快速把 routing config 变成生产配置资产。
  - label: OpenAI-compatible provider layers
    impact: 88
    horizon: 18
    note: 兼容端点降低接入成本，但行为差异仍要求任务级回归评测。
  - label: Model deprecation contracts
    impact: 91
    horizon: 8
    note: 无人值守 Agent 对模型退役尤其敏感，应优先建设预警、探针与显式 fallback。
  - label: Embedded external evaluation
    impact: 96
    horizon: 35
    note: 如果持续外部评测成为惯例，前沿模型发布流程会出现新的独立验证层。
actions:
  - title: 拆分 Agent 运行时的四类身份
    description: 分别记录 Harness 版本、实际模型版本、Provider 路由和执行环境，让同一任务的成本、行为与失败原因可以独立追踪。
  - title: 把模型路由配置纳入 Eval 与版本控制
    description: 对主 Agent、Oracle、子 Agent 和 fallback 的模型组合建立固定任务集，每次修改 Dial、BYOK Provider 或 Auto 策略都跑回归。
  - title: 为模型退役建立预检与硬失败策略
    description: 在无人值守任务启动前检查模型可用性与 deprecation 时间，并明确哪些任务允许 fallback、哪些任务必须 fail closed。
  - title: 为高风险能力定义证据化发布门禁
    description: 把 capability threshold、独立评测、sandbox 测试和训练环境审计结果写成可审阅工件，再由发布流程决定是否允许扩大能力或权限。
