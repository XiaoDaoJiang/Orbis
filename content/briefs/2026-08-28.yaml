kind: brief
cadence: daily
publishedAt: 2026-08-28
status: published
title: Harness 正在成为模型之外的能力层
summary: 从模型调用走向状态、权限、验证与可恢复执行，Agent 系统的竞争边界正在持续外移。
topics:
  - agent-harness
  - coding-agent
  - mcp
signals:
  - title: Harness 成为系统层
    summary: 模型能力越来越容易替换，执行环境、上下文管理和验证闭环开始决定任务完成率。
    impact: high
  - title: Verification 优先
    summary: Coding Agent 的价值从生成代码，转向运行、验证、修复并提供可审阅的完成证据。
    impact: high
  - title: MCP 回归能力边界
    summary: MCP 更适合作为发现、授权与跨边界调用协议，而不是替代所有 CLI 和 API。
    impact: medium
  - title: 内容与展示解耦
    summary: AI 只生成结构化内容，固定 Schema、Astro 和 Slidev 负责一致的阅读与演示体验。
    impact: high
sections:
  - id: runtime-boundary
    layout: architecture
    title: Agent Runtime 不再只是 Tool Loop
    conclusion: Runtime 正在统一管理模型、工具、状态、权限、环境、恢复和审计。
    facts:
      - 长任务需要可持久化状态和可恢复执行，而不是只保存消息列表。
      - 工具调用必须进入权限、沙箱和审计边界。
    limitations:
      - 不同 Harness 对 Session、Memory 和 Tool 的定义仍未统一。
    references:
      - title: Slidev Building and Hosting
        url: https://sli.dev/guide/hosting
        source: slidev
        supports: 支持独立静态演示应用的构建路径。
  - id: content-schema
    layout: system-map
    title: Schema 比 Prompt 更适合约束内容结构
    conclusion: Prompt 负责内容质量，Schema 负责字段、数量、URL 和枚举的确定性约束。
    facts:
      - Daily Brief 固定四个 signals，并限制 sections 和 actions 数量。
      - 构建前验证可阻止缺失来源或非法布局进入生产页面。
    limitations:
      - Schema 无法替代事实核验与编辑判断。
    references:
      - title: Astro Content Collections
        url: https://docs.astro.build/en/guides/content-collections/
        source: astro
        supports: 支持构建期内容加载和 Schema 校验。
  - id: dual-output
    layout: comparison
    title: 同一内容应同时生成阅读版和演示版
    conclusion: Astro 面向搜索、手机和归档，Slidev 面向逐页分享和全屏演示。
    facts:
      - 两种输出共享事实、判断、Topic 和 References。
      - UI 实现彼此独立，避免 Astro 与 Slidev Runtime 直接耦合。
    limitations:
      - 阅读密度和演示密度需要通过字段分层协调。
    references:
      - title: Slidev UI
        url: https://sli.dev/guide/ui
        source: slidev
        supports: 支持键盘、概览和演讲者等交互能力。
  - id: rss-loop
    layout: timeline
    title: RSS 同时承担发现入口和订阅出口
    conclusion: RSS 输入形成候选发现流程，RSS 输出让全部已发布内容进入标准阅读器。
    facts:
      - 聚合摘要只能用于发现，最终判断必须回查一手来源。
      - Astro 可在静态构建时生成标准 RSS endpoint。
    limitations:
      - RSS 不适合承载所有交互式演示内容。
    references:
      - title: Astro RSS recipe
        url: https://docs.astro.build/en/recipes/rss/
        source: astro
        supports: 支持静态站点生成 RSS Feed。
  - id: publishing
    layout: architecture
    title: GitHub Pages 应发布构建产物而不是手写 HTML
    conclusion: GitHub Actions 统一构建 Astro、Slidev 并组装单一 Pages Artifact。
    facts:
      - 构建产物不再由 AI 或人工直接维护。
      - 当前生产站在原型验证完成前保持不变。
    limitations:
      - 切换 Pages Source 需要独立迁移和回滚方案。
    references:
      - title: GitHub Pages custom workflows
        url: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
        source: github
        supports: 支持自定义 Actions 构建和部署 Pages Artifact。
projects:
  - action: CLONE
    name: withastro/astro
    summary: 验证 Content Collections、静态路由、SEO 与 RSS 的主站能力。
    maturity: stable
    url: https://github.com/withastro/astro
  - action: TEST
    name: slidevjs/slidev
    summary: 验证子路径静态 SPA、概览和固定主题的演示体验。
    maturity: stable
    url: https://github.com/slidevjs/slidev
  - action: READ
    name: pnpm/pnpm
    summary: 研究 Workspace 依赖边界与 CI 缓存策略。
    maturity: stable
    url: https://github.com/pnpm/pnpm
  - action: WATCH
    name: Orbis content pipeline
    summary: 观察多 Deck 构建规模增长后的增量构建需求。
    maturity: experimental
    url: https://github.com/XiaoDaoJiang/Orbis
