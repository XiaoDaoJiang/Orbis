actions:
  - title: 跑通第一条 Vertical Slice
    description: 使用同一份 Brief 生成 Astro 阅读版、Slidev 演示版与 RSS 条目。
  - title: 固定自动内容权限边界
    description: Scheduled Agent 只允许修改 content 下的受控目录。
  - title: 保留现有 Pages 生产站
    description: 原型 CI 只上传构建 Artifact，不切换公开站点。
  - title: 用真实构建结果修正规划
    description: 根据 Astro 和 Slidev CI 日志更新 Schema、路径和组装策略。
