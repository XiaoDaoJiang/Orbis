  "title": "Computer-Use Agent 走向真实工作区：浏览器授权、后台执行与可信评测",
  "summary": "OpenCode Browse 用 MCP 与 Chromium 扩展把 Agent 接入用户现有浏览器，但标签页边界、站点白名单与敏感数据仍需精细治理。Cua Driver Bench 把不抢焦点、不改剪贴板等用户干扰纳入任务通过条件；其公开结果显示只看任务完成率会掩盖后台执行风险。研究对评测误判的复审进一步提示：应同时检查执行轨迹、判题器和权限边界，而非只看一个成功率。",
  "topics": [
    "agent-harness",
    "coding-agent"
  ],
  "signals": [
    {
      "title": "真实浏览器接入降低门槛，也扩大信任边界",
      "summary": "Browse 用 MCP、Chromium 扩展与 Playwright 复用已登录浏览器；默认应最小化可用站点和标签页。",
      "impact": "high"
    },
    {
      "title": "敏感操作必须明确人机交接",
      "summary": "Browse 允许用户移交和收回标签页，并为登录、二步验证与支付提供人工接管流程。",
      "impact": "high"
    },
    {
      "title": "后台执行要把用户不受打扰计入成功",
      "summary": "Cua Driver Bench 要求任务完成、只用 GUI 且前台窗口、输入、鼠标和剪贴板不被干扰。",
      "impact": "high"
    },
    {
      "title": "可信评测需要校验判题器本身",
      "summary": "公开 CUA 轨迹复审发现部分 FAIL 由评测错误或任务损坏导致，单一通过率不能替代审计。",
      "impact": "medium"
    }
  ],
