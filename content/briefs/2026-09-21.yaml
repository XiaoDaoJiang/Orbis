    name: CUA-S1
    summary: 在隔离桌面与固定表单任务中测试“小型决策器 + 通用 Planner”双层架构，记录延迟、错误动作、abstain 和人工确认比例。
    maturity: experimental
    url: https://github.com/trycua/cua/tree/main/libs/cua-s1
  - action: READ
    name: Android Bench
    summary: 阅读 Harbor、mini-swe-agent v2 与 specialized agent 的评测配置，把模型与 Harness 的差异纳入自己的 Coding Agent benchmark。
    maturity: growing
    url: https://developer.android.com/bench
  - action: TEST
    name: Realtime-Venus
    summary: 重点验证双循环委派、结果回送和打断处理，而不是只比较语音模型本身的主观自然度。
    maturity: early
    url: https://github.com/inclusionAI/Realtime-Venus
  - action: TEST
    name: Xing4.0-29B-A4B
    summary: 在真实 Coding Agent 任务中验证 4B active MoE 的速度、tool calling 和 Runtime 兼容性，并记录尚需自定义推理分支的成本。
    maturity: early
    url: https://github.com/XingChen-AGI/Xing4.0-29B-A4B
radar:
  - label: Specialist System One decision models
    impact: 91
    horizon: 8
    note: 对动作空间有限的高频步骤，小模型快路径可以明显降低通用 LLM 的调用次数，但必须保留独立执行边界。
  - label: Harness-aware coding benchmarks
    impact: 96
    horizon: 6
    note: 原生工具调用、specialized agent 与 long-horizon 任务正在让 Coding Agent 评测更接近真实工程系统。
  - label: Dual-loop realtime agent runtime
    impact: 94
    horizon: 12
    note: 实时交互和后台任务解耦后，Voice/Vision Agent 才能在长任务执行期间保持连续对话。
  - label: Structured speech control signals
    impact: 88
    horizon: 8
    note: streaming、diarization 和 turn detection 逐渐成为 Voice Agent Runtime 可直接消费的输入事件。
  - label: Model-runtime co-design
    impact: 93
    horizon: 10
    note: tool parser、reasoning parser、speculative decoding 与 serving 支持决定新模型能否稳定进入现有 Agent Harness。
actions:
  - title: 为 Agent 热路径拆出可替换的快决策层
    description: 找出枚举动作、分类、路由和字段匹配等高频步骤，用小模型或规则实现 fast path，并把复杂规划和异常回退保留给通用 Agent。
  - title: 把 Benchmark 配置与模型版本一起锁定
    description: 记录 Harness、system instructions、tool schema、任务集、provider endpoint 和运行资源，避免把执行环境变化误判成模型能力变化。
  - title: 对实时 Agent 建立前台与后台两个状态机
    description: 将 listen/speak 与 delegate/work/deliver 分开建模，明确打断、取消、结果回送和已经播放确认等状态。
  - title: 新模型接入先跑 Runtime compatibility gate
    description: 在比较模型质量前先验证 tool calling、reasoning parser、长上下文、并发和目标 serving framework，未通过兼容门禁就不要进入生产评测。
