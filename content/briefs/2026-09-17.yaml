radar:
  - label: Background tool calling in live sessions
    impact: 96
    horizon: 14
    note: 对话与工具执行解耦后，状态机、取消和副作用确认会成为 Voice Agent 的核心基础设施。
  - label: Concurrent live reasoning
    impact: 93
    horizon: 18
    note: 边说边想让深度推理进入实时产品，但也需要独立预算、进度与中断语义。
  - label: Typed fast-decision models
    impact: 90
    horizon: 24
    note: 路由、评分和守卫等高频控制任务可能逐步从通用 LLM 中拆出，形成更低延迟的专门执行层。
  - label: Workflow-level approval policies
    impact: 95
    horizon: 12
    note: 长期 Agent 一旦持续操作 SaaS，逐工作流审批、权限继承和定时触发会比 Prompt 约束更重要。
  - label: Multi-speed agent routing
    impact: 97
    horizon: 20
    note: 将实时交互、慢推理、快决策和业务动作分层后，路由与端到端可观测性会成为新的 Harness 能力。
actions:
  - title: 为 Agent 定义 fast path 与 deep path
    description: 把分类、路由、置信度判断等低延迟决策与复杂规划、长链推理分开，并记录每次路由选择、模型版本和失败回退。
  - title: 把实时会话改造成并发状态机
    description: 明确用户打断、后台工具调用、在途推理、取消与新输入之间的优先级，避免继续依赖严格串行的 request-response 假设。
  - title: 将审批策略下沉到工作流配置
    description: 对每个持续运行任务声明触发频率、可写系统、最终确认点和自动执行级别，并让这些策略独立于 Prompt 可审查、可回滚。
  - title: 为结构化快决策建立独立校准集
    description: 使用真实路由、守卫与评分样本测试概率校准、错误类型和阈值稳定性，不把类型安全或厂商速度指标等同于业务正确率。
