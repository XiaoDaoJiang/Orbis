{"kind":"brief","cadence":"daily","evidenceVersion":1,"publishedAt":"2026-11-14","status":"published","title":"Agent 生产系统的五个新变量：高效执行、原生 UI、指令隔离与动态推理","summary":"Google Gemini 4 Hydrogen 与 Antigravity Orchestrator 将速度、配额与模型分工作为编排变量；A2UI 1.0 提供受控组件的跨端原生交互协议；IBM Granite LLMON 尝试在模型输入中显式隔离指令和数据。Claude API 的逐消息 effort Beta 将推理深度控制下沉到会话内部，Inkling 2 Small 则展示稀疏多模态开放权重模型的部署机会和显著硬件门槛。工程落点是建立可测的路由、可审计的 UI 动作、注入攻击测试与成本基线。","topics":["agent-harness","coding-agent","mcp"],"tags":["Generative UI","LLMON","Model Routing","Inference Budget","Open Multimodal Weights"],"signals":[{"title":"Agent 编排开始把任务成功率与配额共同优化","summary":"Gemini 4 Hydrogen 与 Antigravity Orchestrator 将高难判断和高频执行分配给不同模型；公开性能增益仍是厂商口径。","impact":"high"},{"title":"生成式 UI 正在从自由 HTML 转向受控原生组件","summary":"A2UI 1.0 以稳定协议和应用侧组件注册表支持跨端交互，适合将 Agent 输出连接到审核与确认界面。","impact":"high"},{"title":"Prompt Injection 防护向结构化指令与数据绑定演进","summary":"IBM LLMON 使用专用分隔符和指令引用提升静态间接注入鲁棒性；多轮自适应攻击仍需单独验证。","impact":"high"},{"title":"推理预算可细粒度调度，但开放权重不等于轻部署","summary":"Claude 逐消息 effort Beta 尝试保持缓存前缀；Inkling 2 Small 虽为稀疏 MoE，公开硬件需求仍显著。","impact":"medium"}],"sections":[{"id":"hydrogen-orchestrator-efficiency","layout":"metrics","title":"Hydrogen 与 Orchestrator：将模型选择纳入 Run 成本控制","conclusion":"将低延迟执行与高难度判断拆成可测的任务级策略，用真实任务同时比较质量、时延和额度消耗。","facts":[{"id":"hydrogen-nov-release","text":"Google 在 2026 年 11 月 12 日公布 Gemini 4 Hydrogen，面向编码和 Agent 工作流；官方列出的 API 定价为每百万输入 token 1.50 美元、每百万输出 token 7.50 美元，并宣称支持 100 万 token 上下文。","evidence":["google-hydrogen"]},{"id":"hydrogen-vs-flash-benchmark","text":"Google 发布的对比数据显示，在其设定条件下 Hydrogen 的任务完成速度为 Gemini 3.8 Flash 的 2.5 倍，Terminal-Bench 4.1 分数为 57% 对 18.2%；这是发布方披露的评测。","evidence":["google-hydrogen"]},{"id":"antigravity-orchestrator-results","text":"Google 表示 Antigravity Orchestrator 可在同一会话中切换 Carbon 与 Hydrogen 等模型；其 Terminal-Bench 4.0 测试报告称接近 Carbon 的成功率，同时平均减少 24% 配额使用并快 19%。","evidence":["google-hydrogen"]}],"limitations":["厂商报告的基准和配额收益受任务组成、预算、版本及工具环境影响，不可直接等同内部项目收益。"]},{"id":"a2ui-stable-native-interactions","layout":"architecture","title":"A2UI 1.0：模型声明界面，应用决定实际组件与权限","conclusion":"在 Agent 工作台优先采用白名单组件、显式确认与独立动作授权，避免把任意模型输出当作可执行 UI。","facts":[{"id":"a2ui-protocol-release","text":"Google Developers Blog 于 2026 年 11 月 11 日宣布 A2UI 1.0 为首个稳定版本，允许 Agent 描述交互屏幕并由宿主应用使用自身原生组件呈现。","evidence":["google-a2ui"]},{"id":"a2ui-capability-extensions","text":"A2UI 1.0 新增双向函数调用、无障碍支持和扩展元数据；官方同时提供 Python、TypeScript、Dart Agent SDK，并列出 React、Angular、Lit、Flutter、SwiftUI 渲染器。","evidence":["google-a2ui"]},{"id":"a2ui-renderer-maturity","text":"Google 明确指出 Jetpack Compose 渲染器当前仍为 v0.9.1、v1.0 尚待推出；Web 与 Flutter 渲染器可与 MCP Apps 一起使用。","evidence":["google-a2ui"]},{"id":"a2ui-open-repository","text":"A2UI 公开 GitHub 仓库提供协议、跨平台渲染器与示例，可用于检查组件映射和协议集成实现。","evidence":["a2ui-repository"]}],"limitations":["协议描述与组件渲染不是事务执行授权；对工具调用、数据绑定和确认动作仍须做应用端权限检查。"]},{"id":"llmon-typed-instruction-boundaries","layout":"comparison","title":"LLMON：让上下文明确区分指令、工具数据与约束","conclusion":"对检索文本与工具返回值优先建立显式信任边界，并用本地对抗样本评估模型的真实抗注入能力。","facts":[{"id":"ibm-llmon-preview-release","text":"IBM Granite 团队于 2026 年 11 月 12 日公开 LLMON（LLM Object Notation），并提供基于 Granite 4.1 的 3B 与 8B 两个实验预览模型和配套工具。","evidence":["ibm-llmon"]},{"id":"llmon-addressable-structure","text":"LLMON 使用专用特殊 token 分隔和可嵌套的结构标签，以唯一 ID 将待执行指令绑定到目标数据块，并在模型后训练阶段学习该表示。","evidence":["ibm-llmon"]},{"id":"llmon-static-injection-results","text":"IBM 表示 LLMON 预览模型在 OPI、ASB、StruQ 等静态间接 Prompt Injection 评测中更稳健，同时明确表示多轮自适应攻击仍在改进研究中。","evidence":["ibm-llmon"]},{"id":"llmon-repository-tooling","text":"公开的 LLMON GitHub 仓库提供格式及转换工具的源码和使用示例。","evidence":["llmon-repository"]}],"limitations":["结构化输入不能替代外部工具授权、输出验证或多轮攻击测试；发布方结果不代表普遍安全保证。"]},{"id":"claude-per-message-effort","layout":"timeline","title":"逐消息 effort：长会话中分配推理预算而非整体重启","conclusion":"为简单追问和高风险步骤指定不同的推理档位，同时追踪缓存命中、工具正确率与错误恢复。","facts":[{"id":"claude-effort-beta-contract","text":"Claude Platform 的 Per-message effort 文档将该能力标为 Beta，要求在 Messages API 中添加 effort-only system message，并发送 mid-conversation-output-config-2026-07-01 Beta header。","evidence":["claude-effort"]},{"id":"claude-effort-cache-benefit","text":"文档要求保留顶层 output_config.effort 原值，在消息序列内变更后续回合的 effort；由于之前的前缀保持不变，可继续匹配 Prompt Cache。","evidence":["claude-effort"]},{"id":"claude-effort-limitations","text":"Claude 文档明确显示逐消息 effort 不支持 Managed Agents，部分模型及 thinking 组合也不支持会话中变更；缺少 Beta header 会返回 400。","evidence":["claude-effort"]}],"limitations":["逐消息 effort 需要严格保留历史消息顺序与版本；缓存命中和账单节省必须从真实 API 计量确认。"]},{"id":"inkling-open-weights-hardware","layout":"system-map","title":"Inkling 2 Small：开放多模态 MoE 的能力与部署边界","conclusion":"将开放权重选型拆分为模型能力、上下文质量、GPU 内存与服务成本四项独立基线。","facts":[{"id":"inkling-card-modalities","text":"Thinking Machines Lab 的 Inkling 2 Small 模型卡描述其为开放权重的多模态文本与图像输入、文本输出模型，标注 Apache-2.0 许可和最长 100 万 token 上下文。","evidence":["inkling-model-card"]},{"id":"inkling-moe-parameter-count","text":"模型卡记载 Inkling 2 Small 使用 48 层稀疏 MoE，参数总量约 594B、每次激活约 17B，每个 token 路由到 384 个专家中的 8 个。","evidence":["inkling-model-card"]},{"id":"inkling-hardware-requirement","text":"模型卡说明原生 NVFP4 checkpoint 至少需要总计 500GB GPU 显存，MXFP8 checkpoint 至少需要 800GB；提供 SGLang、vLLM 等部署路线。","evidence":["inkling-model-card"]}],"limitations":["活跃参数量不是显存占用量；500GB 聚合显存门槛意味着不能将其误称为普通单卡本地小模型。"]}],"projects":[{"action":"TEST","name":"A2UI","summary":"从协议仓库选择一种前端渲染器，验证可访问性、组件白名单与确认动作。","maturity":"growing","url":"https://github.com/a2ui-project/a2ui"},{"action":"READ","name":"LLMON","summary":"阅读指令与数据区分的 token 结构、转换工具与静态注入评测方法。","maturity":"experimental","url":"https://github.com/generative-computing/llmon"},{"action":"WATCH","name":"Inkling 2 Small","summary":"核实模型卡、许可证与显存需求，在资源允许时再做实际评测。","maturity":"early","url":"https://huggingface.co/thinkingmachines/Inkling-2-Small"}],"radar":[{"label":"多模型 Run 路由的质量与成本曲线","impact":92,"horizon":86,"note":"建立同任务成功率、工具开销、延迟和额度的综合测量。"},{"label":"白名单原生 UI 与 MCP Apps","impact":95,"horizon":81,"note":"优先验证交互确认、组件渲染与实际工具动作的分离。"},{"label":"结构化上下文抗注入","impact":96,"horizon":66,"note":"覆盖静态间接注入、多轮诱导和污染工具输出。"},{"label":"逐消息推理预算","impact":88,"horizon":77,"note":"观察缓存前缀稳定性与高低 effort 切换成本。"},{"label":"大型开放权重 MoE 部署","impact":80,"horizon":41,"note":"对照稀疏激活参数、显存实际占用与服务成本。"}],"actions":[{"title":"建立固定 Agent 任务路由 A/B 基线","description":"针对编码、测试与检索任务记录质量、时延、token、配额消耗，比较单一模型和分工模型。"},{"title":"制作受控 A2UI 工作台原型","description":"仅注册表单、审查卡与图表组件，检查模型生成动作是否都经授权及人工确认。"},{"title":"构造 Prompt Injection 对照实验","description":"使用正常工具结果、恶意检索文本和跨轮诱导分别测试传统提示模板与结构化上下文。"},{"title":"核算推理档位与开放模型硬件成本","description":"记录逐消息 effort 的缓存行为，并依据模型卡估算 Inkling 2 Small 所需 GPU 资源，避免参数量误判。"}],"references":[{"id":"google-hydrogen","title":"Google — Introducing Gemini 4 Hydrogen for Agentic Workflows","url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/","supports":"2026-11-12 发布、模型价格、上下文、厂商性能与 Orchestrator 路由数据。","accessedAt":"2026-11-14"},{"id":"google-a2ui","title":"Google Developers Blog — A2UI 1.0","url":"https://developers.googleblog.com/a2ui-10-build-delightful-fast-reliable-agentic-experiences/","supports":"2026-11-11 稳定协议、双向调用、跨平台渲染与 SDK 支持范围。","accessedAt":"2026-11-14"},{"id":"a2ui-repository","title":"a2ui-project — A2UI GitHub Repository","url":"https://github.com/a2ui-project/a2ui","supports":"A2UI 开放协议与渲染器的代码仓库。","accessedAt":"2026-11-14"},{"id":"ibm-llmon","title":"IBM Granite — LLMON in Granite 4.1","url":"https://huggingface.co/blog/ibm-granite/llmon-an-llm-native-markup-language-now-in-granite","supports":"2026-11-12 模型预览、格式定义、后训练与间接注入评测的发布方报告。","accessedAt":"2026-11-14"},{"id":"llmon-repository","title":"Generative Computing — LLMON Repository","url":"https://github.com/generative-computing/llmon","supports":"LLMON 格式、转换工具和示例的开源实现。","accessedAt":"2026-11-14"},{"id":"claude-effort","title":"Claude Platform Docs — Per-message effort","url":"https://platform.claude.com/docs/en/build-with-claude/effort-per-message","supports":"逐消息 effort Beta、请求配置、缓存前缀及不支持的模型与 API 限制。","accessedAt":"2026-11-14"},{"id":"inkling-model-card","title":"Thinking Machines Lab — Inkling 2 Small Model Card","url":"https://huggingface.co/thinkingmachines/Inkling-2-Small","supports":"模型许可证、MoE 结构、模态、上下文长度、部署软硬件要求。","accessedAt":"2026-11-14"}],"archivePicks":[{"title":"Orbis · 2026-11-13 — Agent 控制面：决策与浏览器安全","url":"https://github.com/XiaoDaoJiang/Orbis/blob/main/content/briefs/2026-11-13.yaml","supports":"延续闭集路由、浏览器权限与执行轨迹治理的讨论。","publishedAt":"2026-11-13"},{"title":"Orbis · 2026-11-11 — 规模化 Agent 的执行边界","url":"https://github.com/XiaoDaoJiang/Orbis/blob/main/content/briefs/2026-11-11.yaml","supports":"回顾模型分层与推理安全控制。","publishedAt":"2026-11-11"}],"corrections":[],"presentation":{"enabled":true,"template":"daily-v1"}}
